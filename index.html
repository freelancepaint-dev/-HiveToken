<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BnBeeHive Receive Test</title>

<style>
body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1{color:#ffd45c;}
.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.6;
}
button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}
.good{color:#55ef7a;font-weight:bold;}
.bad{color:#ff5c5c;font-weight:bold;}
</style>
</head>

<body>

<div class="card">

<h1>BnBeeHive BNB Receive Test</h1>

<div class="box">
<strong>Mainnet BnBeeHive</strong><br>
0x9dE16778D63953B3F778128B1D5cA0c88B797c72
</div>

<div class="box">
<strong>READ-ONLY TEST</strong><br><br>
No transaction will be sent.<br>
No wallet signature is required.<br>
No BNB will leave your wallet.
</div>

<button onclick="runTest()">
Run BNB Receive Simulation
</button>

<div id="result" class="box">
Ready.
</div>

</div>

<script>

const RPC =
"https://bsc-dataseed.bnbchain.org";

const HIVE =
"0x9dE16778D63953B3F778128B1D5cA0c88B797c72";

/*
Arbitrary funded-looking sender used only
for eth_estimateGas simulation.

No private key exists in this page and
nothing can be broadcast.
*/
const FROM =
"0x0000000000000000000000000000000000000001";

async function rpc(method, params){

  const response = await fetch(RPC,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      jsonrpc:"2.0",
      id:1,
      method:method,
      params:params
    })
  });

  const json = await response.json();

  if(json.error){
    throw new Error(
      json.error.message ||
      JSON.stringify(json.error)
    );
  }

  return json.result;
}


async function runTest(){

  const result =
    document.getElementById("result");

  result.innerHTML =
    "Running simulation...";

  try{

    /*
      First verify that this really is
      BSC Mainnet.
    */

    const chainId =
      await rpc("eth_chainId",[]);

    if(chainId.toLowerCase() !== "0x38"){
      throw new Error(
        "RPC is not BSC Mainnet. Chain ID: " +
        chainId
      );
    }


    /*
      Make sure the destination actually
      contains contract bytecode.
    */

    const code =
      await rpc(
        "eth_getCode",
        [HIVE,"latest"]
      );

    if(!code || code === "0x"){
      throw new Error(
        "No contract bytecode found at BnBeeHive address."
      );
    }


    /*
      Simulate an EMPTY-CALLDATA BNB transfer.

      value = 1 wei.

      This is the same receiving mechanism
      HiveToken uses:

      hiveAddress.call{value: bnbReceived}("")

      eth_estimateGas executes the call for
      simulation but DOES NOT broadcast it.
    */

    const gas =
      await rpc(
        "eth_estimateGas",
        [{
          from:FROM,
          to:HIVE,
          value:"0x1",
          data:"0x"
        }]
      );


    result.innerHTML = `
      <span class="good">
      PASS ✅
      </span>

      <br><br>

      BnBeeHive accepted the simulated
      plain-BNB call.

      <br><br>

      Estimated gas:<br>
      ${gas}

      <br><br>

      <strong>
      No transaction was broadcast.
      </strong>
    `;


  }catch(error){

    result.innerHTML = `
      <span class="bad">
      FAIL / REVERT ❌
      </span>

      <br><br>

      The plain-BNB simulation did not
      succeed.

      <br><br>

      ${error.message}

      <br><br>

      <strong>
      Do NOT proceed to mainnet HiveToken
      deployment based on the current
      funding method.
      </strong>
    `;
  }
}

</script>

</body>
</html>
