<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HiveToken V4 Final Threshold</title>

<style>
body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1{color:#ffd45c}
.box{
  background:#050705;
  padding:18px;
  margin-top:18px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}
button{
  width:100%;
  padding:20px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}
button:disabled{
  opacity:.45;
}
.good{
  color:#55ef7a;
  font-weight:bold;
}
.bad{
  color:#ff5c5c;
  font-weight:bold;
}
.warning{
  color:#ffd45c;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Final Threshold</h1>

<div class="box">

<strong>TESTNET ONLY</strong>

<br><br>

Last verified tax balance:

<br>

<strong>
97.40528240959596181 HIVE
</strong>

<br><br>

Threshold:

<br>

<strong>
100 HIVE
</strong>

<br><br>

This page allows exactly:

<br>

<strong>
ONE 0.0003 tBNB BUY
</strong>

</div>

<div class="box">

<strong>HiveToken V4</strong>

<br><br>

0x305cecf060209f758b74dbef91758021f113c608

<br><br>

<strong>V4 HIVE/WBNB Pair</strong>

<br><br>

0x3f8016dea6df1323fe2bee493b15593a8a2b149e

</div>

<button onclick="connectWallet()">
1. Connect Buyer Wallet
</button>

<button
id="buyButton"
onclick="finalBuy()"
disabled>
2. Buy HIVE With 0.0003 tBNB
</button>

<div id="status" class="box">
Ready.
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>

const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";

const PAIR =
"0x3f8016dea6df1323fe2bee493b15593a8a2b149e";

const ROUTER =
"0xd99d1c33f9fc3444f8101754abc46c52416550d1";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";

const BUY_AMOUNT =
ethers.utils.parseEther("0.0003");

const THRESHOLD =
ethers.utils.parseUnits("100",18);

let account = null;
let buyAttempted = false;


function ethereumProvider(){

  if(
    typeof window.ethereum === "undefined" ||
    typeof window.ethereum.request !== "function"
  ){
    throw new Error(
      "Wallet provider not found."
    );
  }

  return window.ethereum;
}


function provider(){

  return new ethers.providers.Web3Provider(
    ethereumProvider()
  );
}


function signer(){

  return provider().getSigner();
}


async function requireTestnet(){

  const chainId =
    await ethereumProvider().request({
      method:"eth_chainId"
    });

  if(chainId.toLowerCase() !== "0x61"){

    throw new Error(
      "Wrong network. Switch to BNB Smart Chain Testnet."
    );

  }
}


function tokenContract(){

  return new ethers.Contract(
    TOKEN,
    [
      "function owner() view returns(address)",
      "function isTaxExempt(address) view returns(bool)",
      "function balanceOf(address) view returns(uint256)",
      "function pair() view returns(address)",
      "function pairLocked() view returns(bool)",
      "function swapThreshold() view returns(uint256)"
    ],
    provider()
  );
}


async function connectWallet(){

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("buyButton");

  try{

    button.disabled = true;

    await requireTestnet();

    const accounts =
      await ethereumProvider().request({
        method:"eth_requestAccounts"
      });

    if(!accounts || accounts.length === 0){

      throw new Error(
        "No wallet account returned."
      );

    }

    account = accounts[0];

    const token =
      tokenContract();

    const owner =
      await token.owner();

    const exempt =
      await token.isTaxExempt(account);

    const configuredPair =
      await token.pair();

    const locked =
      await token.pairLocked();

    const threshold =
      await token.swapThreshold();

    const taxBalance =
      await token.balanceOf(TOKEN);

    const bnbBalance =
      await provider().getBalance(account);


    if(
      account.toLowerCase() ===
      owner.toLowerCase()
    ){

      throw new Error(
        "Use the non-owner buyer wallet."
      );

    }


    if(exempt){

      throw new Error(
        "Buyer wallet is tax exempt."
      );

    }


    if(
      configuredPair.toLowerCase() !==
      PAIR.toLowerCase()
    ){

      throw new Error(
        "Configured pair does not match the V4 pair."
      );

    }


    if(!locked){

      throw new Error(
        "V4 pair is not locked."
      );

    }


    if(!threshold.eq(THRESHOLD)){

      throw new Error(
        "Unexpected swap threshold."
      );

    }


    /*
      CRITICAL SAFETY CHECK

      Never buy if threshold is already reached.
    */

    if(taxBalance.gte(THRESHOLD)){

      status.innerHTML = `

      <span class="good">
      THRESHOLD ALREADY REACHED ✅
      </span>

      <br><br>

      Current tax balance:

      <br><br>

      <strong>
      ${ethers.utils.formatUnits(
        taxBalance,
        18
      )} HIVE
      </strong>

      <br><br>

      <strong>STOP HERE.</strong>

      <br><br>

      Do not buy or sell.

      <br><br>

      Send me a screenshot.

      `;

      return;
    }


    if(bnbBalance.lt(BUY_AMOUNT)){

      throw new Error(
        "Not enough tBNB for this test plus gas."
      );

    }


    const needed =
      THRESHOLD.sub(taxBalance);


    button.disabled = false;


    status.innerHTML = `

    <span class="good">
    FINAL BUY READY ✅
    </span>

    <br><br>

    Current tax balance:

    <br><br>

    <strong>
    ${ethers.utils.formatUnits(
      taxBalance,
      18
    )} HIVE
    </strong>

    <br><br>

    HIVE needed to reach threshold:

    <br><br>

    <strong>
    ${ethers.utils.formatUnits(
      needed,
      18
    )} HIVE
    </strong>

    <br><br>

    Test buy:

    <br><br>

    <strong>
    0.0003 tBNB
    </strong>

    <br><br>

    <span class="warning">
    Press button 2 exactly once.
    </span>

    `;


  }catch(error){

    account = null;
    button.disabled = true;

    status.innerHTML = `

    <span class="bad">
    CHECK FAILED ❌
    </span>

    <br><br>

    ${error.message}

    `;

  }

}



async function finalBuy(){

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("buyButton");


  try{

    if(buyAttempted){

      throw new Error(
        "This page already attempted the final buy."
      );

    }


    buyAttempted = true;
    button.disabled = true;


    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect buyer wallet first."
      );

    }


    const token =
      tokenContract();


    /*
      Check immediately before transaction.
    */

    const before =
      await token.balanceOf(TOKEN);


    if(before.gte(THRESHOLD)){

      status.innerHTML = `

      <span class="good">
      THRESHOLD ALREADY REACHED ✅
      </span>

      <br><br>

      ${ethers.utils.formatUnits(
        before,
        18
      )} HIVE

      <br><br>

      No transaction was sent.

      <br><br>

      <strong>STOP HERE.</strong>

      `;

      return;
    }


    const router =
      new ethers.Contract(
        ROUTER,
        [
          "function swapExactETHForTokensSupportingFeeOnTransferTokens(uint256,address[],address,uint256) payable"
        ],
        signer()
      );


    const latestBlock =
      await provider().getBlock("latest");

    const deadline =
      latestBlock.timestamp + 1200;


    status.innerHTML = `

    <span class="warning">
    FINAL 0.0003 tBNB BUY
    </span>

    <br><br>

    Confirm the transaction in your wallet.

    `;


    const tx =
      await router
      .swapExactETHForTokensSupportingFeeOnTransferTokens(
        0,
        [
          WBNB,
          TOKEN
        ],
        account,
        deadline,
        {
          value:BUY_AMOUNT
        }
      );


    status.innerHTML = `

    Transaction submitted ✅

    <br><br>

    ${tx.hash}

    <br><br>

    Waiting for confirmation...

    `;


    await tx.wait();


    const after =
      await token.balanceOf(TOKEN);

    const added =
      after.sub(before);


    if(after.gte(THRESHOLD)){

      status.innerHTML = `

      <span class="good">
      100 HIVE THRESHOLD REACHED ✅
      </span>

      <br><br>

      <strong>
      Tax balance before:
      </strong>

      <br><br>

      ${ethers.utils.formatUnits(
        before,
        18
      )} HIVE

      <br><br>

      <strong>
      Tax added:
      </strong>

      <br><br>

      ${ethers.utils.formatUnits(
        added,
        18
      )} HIVE

      <br><br>

      <strong>
      Tax balance now:
      </strong>

      <br><br>

      ${ethers.utils.formatUnits(
        after,
        18
      )} HIVE

      <br><br>

      <span class="good">
      AUTOMATIC FUNDING TEST READY ✅
      </span>

      <br><br>

      <strong>STOP HERE.</strong>

      <br><br>

      DO NOT BUY AGAIN.

      <br><br>

      DO NOT SELL YET.

      <br><br>

      The next controlled sell will test whether
      HiveToken automatically swaps the accumulated
      HIVE tax into tBNB and calls the Test Hive
      Receiver's buyEggs(address) function.

      <br><br>

      Send me a screenshot.

      `;

    }else{

      status.innerHTML = `

      <span class="warning">
      STILL BELOW 100 HIVE
      </span>

      <br><br>

      Tax balance before:

      <br><br>

      ${ethers.utils.formatUnits(
        before,
        18
      )} HIVE

      <br><br>

      Tax added:

      <br><br>

      ${ethers.utils.formatUnits(
        added,
        18
      )} HIVE

      <br><br>

      Current tax balance:

      <br><br>

      <strong>
      ${ethers.utils.formatUnits(
        after,
        18
      )} HIVE
      </strong>

      <br><br>

      <strong>STOP HERE.</strong>

      <br><br>

      Do not repeat the transaction.

      <br><br>

      Send me a screenshot.

      `;

    }


  }catch(error){

    button.disabled = true;

    status.innerHTML = `

    <span class="bad">
    TRANSACTION FAILED ❌
    </span>

    <br><br>

    ${error.message}

    <br><br>

    <strong>STOP HERE.</strong>

    `;

  }

}


if(typeof window.ethereum !== "undefined"){

  window.ethereum.on(
    "accountsChanged",
    function(){
      location.reload();
    }
  );

  window.ethereum.on(
    "chainChanged",
    function(){
      location.reload();
    }
  );

}

</script>

</body>
</html>
