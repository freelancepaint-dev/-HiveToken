<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveToken V3 Sell Tax Test</title>

<style>
body {
  background:#0b0f0b;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}
.card {
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1 { color:#ffd45c; }
.box {
  background:#050705;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.6;
}
button {
  width:100%;
  padding:17px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}
.connect { background:#eee; color:#111; }
.approve { background:#ffd45c; color:#111; }
.sell { background:#ffb347; color:#111; }
.good { color:#55ef7a; font-weight:bold; }
.bad { color:#ff5c5c; font-weight:bold; }
.label { color:#aaa; }
</style>
</head>

<body>

<div class="card">

<h1>HiveToken V3 Sell Tax Test</h1>

<p>
BSC Testnet only.
This test sells exactly <strong>100 HIVE</strong>.
</p>

<div class="box">
<span class="label">Required Wallet</span><br>
0x77Dc64A638100407F756393dF33640d5cDf45619
</div>

<div class="box">
<span class="label">HiveToken V3</span><br>
0xf10f0091a7504761e5e0cab7a7de34df077871f8
</div>

<div class="box">
<span class="label">Test Sell</span><br>
100 HIVE
<br><br>
Expected tax:<br>
<strong>2.5 HIVE</strong>
</div>

<button class="connect" onclick="connectWallet()">
1. Connect Test Wallet
</button>

<button class="approve" onclick="approveHive()">
2. Approve 100 HIVE
</button>

<button class="sell" onclick="sellHive()">
3. Sell 100 HIVE
</button>

<div id="status" class="box">
Ready.
</div>

</div>

<script>

const HIVE =
"0xf10f0091a7504761e5e0cab7a7de34df077871f8";

const ROUTER =
"0xD99D1c33F9fC3444f8101754aBC46c52416550D1";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";

const REQUIRED_WALLET =
"0x77Dc64A638100407F756393dF33640d5cDf45619";

const CHAIN_ID = "0x61";

const SELL_AMOUNT =
100n * (10n ** 18n);

let account = null;


/* -----------------------------
   HELPERS
------------------------------ */

function strip0x(v) {
  return v.toLowerCase().replace("0x","");
}

function encodeUint(v) {
  return BigInt(v)
    .toString(16)
    .padStart(64,"0");
}

function encodeAddress(v) {
  return strip0x(v)
    .padStart(64,"0");
}

function fail(message) {
  document.getElementById("status").innerHTML =
    "<span class='bad'>STOP</span><br><br>" +
    message;
}


/* -----------------------------
   CONNECT
------------------------------ */

async function connectWallet() {

  try {

    if (!window.ethereum) {
      throw new Error(
        "Open this page inside your wallet browser."
      );
    }

    const accounts =
      await window.ethereum.request({
        method:"eth_requestAccounts"
      });

    account = accounts[0];

    let chain =
      await window.ethereum.request({
        method:"eth_chainId"
      });

    if (chain.toLowerCase() !== CHAIN_ID) {

      await window.ethereum.request({
        method:"wallet_switchEthereumChain",
        params:[
          { chainId:CHAIN_ID }
        ]
      });

      chain =
        await window.ethereum.request({
          method:"eth_chainId"
        });
    }

    if (chain.toLowerCase() !== CHAIN_ID) {
      throw new Error(
        "Wallet is not on BSC Testnet."
      );
    }

    if (
      account.toLowerCase() !==
      REQUIRED_WALLET.toLowerCase()
    ) {

      throw new Error(
        "Wrong wallet connected. Switch to 0x77Dc...45619."
      );
    }

    document.getElementById("status").innerHTML = `
      <span class="good">
      Correct non-exempt wallet ✅
      </span>

      <br><br>

      ${account}

      <br><br>

      <span class="good">
      BSC Testnet confirmed ✅
      </span>
    `;

  } catch(error) {
    fail(error.message);
  }
}


/* -----------------------------
   VERIFY BEFORE TX
------------------------------ */

async function verify() {

  if (!account)
    throw new Error(
      "Connect the wallet first."
    );

  const chain =
    await window.ethereum.request({
      method:"eth_chainId"
    });

  if (chain.toLowerCase() !== CHAIN_ID)
    throw new Error(
      "Wrong network. BSC Testnet required."
    );

  if (
    account.toLowerCase() !==
    REQUIRED_WALLET.toLowerCase()
  )
    throw new Error(
      "Wrong wallet."
    );
}


/* -----------------------------
   APPROVE EXACTLY 100 HIVE
------------------------------ */

async function approveHive() {

  try {

    await verify();

    /*
      approve(address,uint256)
      selector = 0x095ea7b3
    */

    const data =
      "0x095ea7b3" +
      encodeAddress(ROUTER) +
      encodeUint(SELL_AMOUNT);

    const txHash =
      await window.ethereum.request({

        method:"eth_sendTransaction",

        params:[{
          from:account,
          to:HIVE,
          value:"0x0",
          data:data
        }]
      });

    document.getElementById("status").innerHTML = `
      <span class="good">
      Approval submitted ✅
      </span>

      <br><br>

      Approved exactly:
      <strong>100 HIVE</strong>

      <br><br>

      Transaction Hash:<br>
      ${txHash}

      <br><br>

      Wait for this approval to confirm
      before tapping Sell.
    `;

  } catch(error) {
    fail(error.message);
  }
}


/* -----------------------------
   SELL EXACTLY 100 HIVE
------------------------------ */

async function sellHive() {

  try {

    await verify();

    /*
      swapExactTokensForETHSupportingFeeOnTransferTokens(
        uint256 amountIn,
        uint256 amountOutMin,
        address[] path,
        address to,
        uint256 deadline
      )

      selector = 0x791ac947
    */

    const selector =
      "791ac947";

    const amountIn =
      encodeUint(SELL_AMOUNT);

    /*
      Static head contains 5 x 32 bytes.
      Dynamic path therefore begins at
      byte offset 160 = 0xA0.
    */

    const amountOutMin =
      encodeUint(0);

    const pathOffset =
      encodeUint(160);

    /*
      BNB from the sell goes back to
      the connected test wallet.
    */

    const recipient =
      encodeAddress(account);

    const deadline =
      encodeUint(
        Math.floor(Date.now()/1000) + 1200
      );

    const pathLength =
      encodeUint(2);

    const path0 =
      encodeAddress(HIVE);

    const path1 =
      encodeAddress(WBNB);


    const data =
      "0x" +
      selector +
      amountIn +
      amountOutMin +
      pathOffset +
      recipient +
      deadline +
      pathLength +
      path0 +
      path1;


    const txHash =
      await window.ethereum.request({

        method:"eth_sendTransaction",

        params:[{
          from:account,
          to:ROUTER,
          value:"0x0",
          data:data
        }]
      });


    document.getElementById("status").innerHTML = `
      <span class="good">
      100 HIVE sell submitted ✅
      </span>

      <br><br>

      Transaction Hash:<br>
      ${txHash}

      <br><br>

      Send me the BscScan
      BEP-20 Tokens Transferred screenshot.
    `;


  } catch(error) {
    fail(error.message);
  }
}

</script>

</body>
</html>
