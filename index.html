<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiveToken V3 — Contract Check</title>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .card {
      max-width: 650px;
      margin: auto;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 14px;
    }

    h1 {
      color: #f5c542;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: #f5c542;
      color: #111;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .result {
      background: #090909;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .good {
      color: #4cff72;
    }

    .bad {
      color: #ff5c5c;
    }

    .label {
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>HiveToken V3</h1>

  <p>
    Read-only contract diagnostic.
    This does not send any transactions.
  </p>

  <div class="result">
    <span class="label">V3 Token:</span><br>
    0xf10f0091a7504761e5e0cab7a7de34df077871f8
  </div>

  <button onclick="connectWallet()">
    Connect Wallet
  </button>

  <button onclick="runChecks()">
    Run V3 Contract Checks
  </button>

  <div id="wallet" class="result">
    Wallet: Not connected
  </div>

  <div id="results" class="result">
    Contract checks not run.
  </div>

</div>

<script>

const TOKEN =
"0xf10f0091a7504761e5e0cab7a7de34df077871f8";

const EXPECTED_PAIR =
"0x56b09a344c35c4e3c2d14beb76ebae951ceb51a6";

let account = null;


/* ---------- READ-ONLY ETH_CALL ---------- */

async function ethCall(data) {

  const result =
    await window.ethereum.request({
      method: "eth_call",
      params: [
        {
          to: TOKEN,
          data: data
        },
        "latest"
      ]
    });

  return result;
}


/* ---------- DECODERS ---------- */

function decodeAddress(result) {

  if (!result || result === "0x")
    return "NO RETURN DATA";

  return "0x" + result.slice(-40);
}


function decodeUint(result) {

  if (!result || result === "0x")
    return "NO RETURN DATA";

  return BigInt(result).toString();
}


function decodeBool(result) {

  if (!result || result === "0x")
    return "NO RETURN DATA";

  return BigInt(result) !== 0n;
}


function padAddress(address) {

  return address
    .toLowerCase()
    .replace("0x","")
    .padStart(64,"0");
}


/* ---------- CONNECT ---------- */

async function connectWallet() {

  try {

    if (!window.ethereum) {
      alert("Open this page inside your wallet browser.");
      return;
    }

    const accounts =
      await window.ethereum.request({
        method: "eth_requestAccounts"
      });

    account = accounts[0];

    document.getElementById("wallet").innerHTML =
      "Wallet:<br>" + account;

  } catch (err) {

    document.getElementById("wallet").innerHTML =
      "Connection error:<br>" + err.message;
  }
}


/* ---------- CONTRACT CHECKS ---------- */

async function runChecks() {

  const output =
    document.getElementById("results");

  try {

    if (!window.ethereum) {
      output.innerHTML =
        "Open this page inside your wallet browser.";
      return;
    }

    output.innerHTML =
      "Reading V3 contract...";

    /*
      Function selectors

      owner()
      pair()
      pairLocked()
      BUY_TAX()
      SELL_TAX()
      swapThreshold()
    */

    const ownerRaw =
      await ethCall("0x8da5cb5b");

    const pairRaw =
      await ethCall("0xa8aa1b31");

    const pairLockedRaw =
      await ethCall("0x0cdb5e3b");

    /*
      Solidity public constant selectors are calculated
      here dynamically to avoid relying on guessed values.
    */

    async function selector(signature) {

      const hex =
        Array.from(
          new TextEncoder().encode(signature)
        )
        .map(b =>
          b.toString(16).padStart(2,"0")
        )
        .join("");

      const hash =
        await window.ethereum.request({
          method: "web3_sha3",
          params: ["0x" + hex]
        });

      return hash.slice(0,10);
    }


    const buySelector =
      await selector("BUY_TAX()");

    const sellSelector =
      await selector("SELL_TAX()");

    const thresholdSelector =
      await selector("swapThreshold()");

    const exemptSelector =
      await selector("isTaxExempt(address)");


    const buyRaw =
      await ethCall(buySelector);

    const sellRaw =
      await ethCall(sellSelector);

    const thresholdRaw =
      await ethCall(thresholdSelector);


    const owner =
      decodeAddress(ownerRaw);

    const pair =
      decodeAddress(pairRaw);

    const pairLocked =
      decodeBool(pairLockedRaw);

    const buyTax =
      decodeUint(buyRaw);

    const sellTax =
      decodeUint(sellRaw);

    const threshold =
      decodeUint(thresholdRaw);


    /* OWNER TAX EXEMPT CHECK */

    let ownerExempt = "UNKNOWN";

    if (owner.startsWith("0x")) {

      const data =
        exemptSelector +
        padAddress(owner);

      ownerExempt =
        decodeBool(
          await ethCall(data)
        );
    }


    /* CONNECTED WALLET TAX EXEMPT CHECK */

    let walletExempt =
      "Connect wallet to check";

    if (account) {

      const data =
        exemptSelector +
        padAddress(account);

      walletExempt =
        decodeBool(
          await ethCall(data)
        );
    }


    const pairMatch =
      pair.toLowerCase() ===
      EXPECTED_PAIR.toLowerCase();


    output.innerHTML = `

      <b>V3 ON-CHAIN RESULTS</b>
      <br><br>

      <span class="label">Owner</span><br>
      ${owner}
      <br><br>

      <span class="label">Stored Pair</span><br>
      ${pair}
      <br>

      <b class="${pairMatch ? "good":"bad"}">
      Pair Match:
      ${pairMatch ? "YES ✅":"NO ❌"}
      </b>

      <br><br>

      <span class="label">Pair Locked</span><br>
      ${pairLocked}

      <br><br>

      <span class="label">BUY_TAX</span><br>
      ${buyTax}
      ${buyTax === "250"
        ? " (2.5%) ✅"
        : " ❌"}

      <br><br>

      <span class="label">SELL_TAX</span><br>
      ${sellTax}
      ${sellTax === "250"
        ? " (2.5%) ✅"
        : " ❌"}

      <br><br>

      <span class="label">Swap Threshold</span><br>
      ${threshold}
      <br>
      Expected:
      100000000000000000000
      (100 HIVE)

      <br><br>

      <span class="label">Owner Tax Exempt</span><br>
      ${ownerExempt}

      <br><br>

      <span class="label">
      Connected Wallet Tax Exempt
      </span><br>

      ${walletExempt}

    `;

  } catch (err) {

    output.innerHTML =
      "<span class='bad'>Check failed:</span><br>" +
      err.message;
  }
}

</script>

</body>
</html>
