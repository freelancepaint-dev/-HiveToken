<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HiveToken V4 Pair Setup</title>

<style>
body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}

h1{
  color:#ffd45c;
}

.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}

button{
  width:100%;
  padding:18px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.good{
  color:#55ef7a;
  font-weight:bold;
}

.bad{
  color:#ff5c5c;
  font-weight:bold;
}

.warning{
  color:#ffd45c;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Pair Setup</h1>

<div class="box">

<strong>TESTNET ONLY</strong>

<br><br>

HiveToken V4:

<br>

0x305cecf060209f758b74dbef91758021f113c608

<br><br>

WBNB:

<br>

0xae13d989dac2f0debff460ac112a837c89baa7cd

<br><br>

PancakeSwap V2 Factory:

<br>

0x6725f303b657a9451d8ba641348b6761a6cc7a17

</div>


<button onclick="connectWallet()">
1. Connect Wallet
</button>


<button
  id="createButton"
  onclick="createOrFindPair()"
  disabled
>
2. Create / Find V4 HIVE-WBNB Pair
</button>


<button
  id="setButton"
  onclick="setPair()"
  disabled
>
3. Permanently Set Pair in HiveToken
</button>


<div
  id="status"
  class="box"
>
Ready.
</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
</script>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";

const FACTORY =
"0x6725f303b657a9451d8ba641348b6761a6cc7a17";

const ZERO =
"0x0000000000000000000000000000000000000000";


let account =
  null;

let pairAddress =
  null;


/* =========================================================
   WALLET PROVIDER
   ========================================================= */

function getEthereum(){

  if(
    typeof window.ethereum === "undefined"
  ){

    throw new Error(
      "Wallet provider not found. Open this page inside your wallet browser."
    );
  }


  return window.ethereum;
}


/* =========================================================
   VERIFY BSC TESTNET
   ========================================================= */

async function requireTestnet(){

  const chainId =
    await getEthereum().request({
      method:"eth_chainId"
    });


  if(
    chainId.toLowerCase() !== "0x61"
  ){

    throw new Error(
      "Wrong network. Use BNB Smart Chain Testnet — Chain ID 97."
    );
  }

}


/* =========================================================
   ETHERS SIGNER
   ========================================================= */

function getSigner(){

  const provider =
    new ethers.providers.Web3Provider(
      getEthereum()
    );


  return provider.getSigner();
}


/* =========================================================
   CONNECT WALLET
   ========================================================= */

async function connectWallet(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    await requireTestnet();


    const accounts =
      await getEthereum().request({
        method:
          "eth_requestAccounts"
      });


    if(
      !accounts ||
      accounts.length === 0
    ){

      throw new Error(
        "No wallet account returned."
      );
    }


    account =
      accounts[0];


    /*
      Verify connected wallet owns V4.
    */

    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function owner() view returns(address)",
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)"
        ],
        getSigner()
      );


    const owner =
      await token.owner();


    const currentPair =
      await token.pair();


    const locked =
      await token.pairLocked();


    if(
      owner.toLowerCase() !==
      account.toLowerCase()
    ){

      throw new Error(
        "Connected wallet is not the HiveToken V4 owner."
      );
    }


    /*
      If pair is already locked,
      stop immediately.
    */

    if(locked){

      status.innerHTML = `
        <span class="good">
        PAIR ALREADY CONFIGURED ✅
        </span>

        <br><br>

        Pair:

        <br><br>

        ${currentPair}

        <br><br>

        No additional pair setup
        transaction is needed.
      `;


      document.getElementById(
        "createButton"
      ).disabled =
        true;


      document.getElementById(
        "setButton"
      ).disabled =
        true;


      return;
    }


    document.getElementById(
      "createButton"
    ).disabled =
      false;


    status.innerHTML = `
      <span class="good">
      OWNER CONNECTED ✅
      </span>

      <br><br>

      ${account}

      <br><br>

      BSC Testnet confirmed.

      <br><br>

      HiveToken pair is currently unset.

      <br><br>

      <strong>
      Press button 2.
      </strong>
    `;


  }catch(error){

    document.getElementById(
      "createButton"
    ).disabled =
      true;


    document.getElementById(
      "setButton"
    ).disabled =
      true;


    status.innerHTML = `
      <span class="bad">
      CONNECTION FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   CREATE OR FIND PAIR
   ========================================================= */

async function createOrFindPair(){

  const status =
    document.getElementById(
      "status"
    );


  const createButton =
    document.getElementById(
      "createButton"
    );


  try{

    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect wallet first."
      );
    }


    createButton.disabled =
      true;


    const factory =
      new ethers.Contract(
        FACTORY,
        [
          "function getPair(address,address) view returns(address)",
          "function createPair(address,address) returns(address)"
        ],
        getSigner()
      );


    /*
      First ask the factory if the
      V4 HIVE/WBNB pair already exists.
    */

    let existing =
      await factory.getPair(
        TOKEN,
        WBNB
      );


    /*
      Existing pair found.
    */

    if(
      existing.toLowerCase() !==
      ZERO.toLowerCase()
    ){

      pairAddress =
        existing;


      document.getElementById(
        "setButton"
      ).disabled =
        false;


      status.innerHTML = `
        <span class="good">
        V4 PAIR FOUND ✅
        </span>

        <br><br>

        <strong>
        Pair Address:
        </strong>

        <br><br>

        ${pairAddress}

        <br><br>

        This address was returned directly
        by the PancakeSwap V2 factory for:

        <br><br>

        HiveToken V4

        <br>

        +

        <br>

        WBNB

        <br><br>

        <strong>
        STOP HERE.
        </strong>

        <br><br>

        Do not press button 3 yet.

        <br><br>

        Send me a screenshot of this
        pair address first.
      `;


      return;
    }


    /*
      No pair exists yet.
      Ask wallet to create it.
    */

    status.innerHTML = `
      <span class="warning">
      NO V4 PAIR EXISTS YET
      </span>

      <br><br>

      Your wallet will ask you to approve
      creation of the V4 HIVE-WBNB pair.

      <br><br>

      Network must be:

      <br>

      <strong>
      BNB Smart Chain Testnet
      </strong>
    `;


    const tx =
      await factory.createPair(
        TOKEN,
        WBNB
      );


    status.innerHTML = `
      <span class="good">
      PAIR CREATION SENT ✅
      </span>

      <br><br>

      Transaction:

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    /*
      After confirmation, retrieve the
      canonical pair directly from factory.
    */

    existing =
      await factory.getPair(
        TOKEN,
        WBNB
      );


    if(
      existing.toLowerCase() ===
      ZERO.toLowerCase()
    ){

      throw new Error(
        "Pair creation confirmed but factory still returned zero address."
      );
    }


    pairAddress =
      existing;


    document.getElementById(
      "setButton"
    ).disabled =
      false;


    status.innerHTML = `
      <span class="good">
      V4 HIVE-WBNB PAIR CREATED ✅
      </span>

      <br><br>

      <strong>
      Pair Address:
      </strong>

      <br><br>

      ${pairAddress}

      <br><br>

      Factory:

      <br><br>

      ${FACTORY}

      <br><br>

      <strong>
      STOP HERE.
      </strong>

      <br><br>

      Do NOT press button 3 yet.

      <br><br>

      Send me a screenshot of this
      pair address first.
    `;


  }catch(error){

    createButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      PAIR CREATION FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   PERMANENTLY SET PAIR
   ========================================================= */

async function setPair(){

  const status =
    document.getElementById(
      "status"
    );


  const setButton =
    document.getElementById(
      "setButton"
    );


  try{

    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect wallet first."
      );
    }


    if(!pairAddress){

      throw new Error(
        "No verified pair address loaded."
      );
    }


    /*
      Recheck the factory immediately
      before permanent configuration.
    */

    const factory =
      new ethers.Contract(
        FACTORY,
        [
          "function getPair(address,address) view returns(address)"
        ],
        getSigner()
      );


    const verifiedPair =
      await factory.getPair(
        TOKEN,
        WBNB
      );


    if(
      verifiedPair.toLowerCase() !==
      pairAddress.toLowerCase()
    ){

      throw new Error(
        "Factory verification failed. Pair will NOT be locked."
      );
    }


    /*
      Recheck token state.
    */

    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function owner() view returns(address)",
          "function setPair(address)",
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)"
        ],
        getSigner()
      );


    const owner =
      await token.owner();


    if(
      owner.toLowerCase() !==
      account.toLowerCase()
    ){

      throw new Error(
        "Connected wallet is not the HiveToken owner."
      );
    }


    const alreadyLocked =
      await token.pairLocked();


    if(alreadyLocked){

      throw new Error(
        "HiveToken pair is already locked."
      );
    }


    setButton.disabled =
      true;


    status.innerHTML = `
      <span class="warning">
      PERMANENT PAIR CONFIGURATION
      </span>

      <br><br>

      Factory verified pair:

      <br><br>

      ${verifiedPair}

      <br><br>

      Your wallet will request approval
      for HiveToken.setPair().

      <br><br>

      <strong>
      This setting cannot be changed later.
      </strong>
    `;


    const tx =
      await token.setPair(
        verifiedPair
      );


    status.innerHTML = `
      Pair configuration sent ✅

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    /*
      Verify permanent state.
    */

    const savedPair =
      await token.pair();


    const locked =
      await token.pairLocked();


    if(
      !locked ||
      savedPair.toLowerCase() !==
      verifiedPair.toLowerCase()
    ){

      throw new Error(
        "Post-transaction pair verification failed."
      );
    }


    status.innerHTML = `
      <span class="good">
      V4 PAIR CONFIGURED & LOCKED ✅
      </span>

      <br><br>

      <strong>
      HIVE-WBNB Pair:
      </strong>

      <br><br>

      ${savedPair}

      <br><br>

      Pair Locked:

      <br>

      ${locked}

      <br><br>

      <strong>
      STOP HERE.
      </strong>

      <br><br>

      Do not add liquidity yet.

      <br><br>

      Send me a screenshot.
    `;


  }catch(error){

    setButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      SET PAIR FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   WALLET / NETWORK CHANGES
   ========================================================= */

if(
  typeof window.ethereum !== "undefined"
){

  window.ethereum.on(
    "accountsChanged",
    function(){
      location.reload();
    }
  );


  window.ethereum.on(
    "chainChanged",
    function(){
      location.reload();
    }
  );

}

</script>

</body>
</html>
