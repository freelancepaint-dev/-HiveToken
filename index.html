<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HiveToken V4 Verification</title>

<style>
body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1{color:#ffd45c;}
.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}
button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}
.good{
  color:#55ef7a;
  font-weight:bold;
}
.bad{
  color:#ff5c5c;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Verification</h1>

<div class="box">
<strong>READ ONLY</strong><br><br>
No transaction.<br>
No signature.<br>
No gas.<br>
No BNB will leave your wallet.
</div>

<div class="box">
<strong>HiveToken V4</strong><br><br>
0x305cecf060209f758b74dbef91758021f113c608
</div>

<button onclick="verify()">
Verify HiveToken V4
</button>

<div id="results" class="box">
Ready.
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>

/* =========================================================
   CONFIG
   ========================================================= */

const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";

const EXPECTED_ROUTER =
"0xD99D1c33F9fC3444f8101754aBC46c52416550D1";

const EXPECTED_HIVE =
"0xd22d8d7a8a3a3a7293168b5c83413060fd11ece1";

const RPC =
"https://bsc-testnet-rpc.publicnode.com";


/* =========================================================
   ABI
   ========================================================= */

const ABI = [

  "function name() view returns (string)",

  "function symbol() view returns (string)",

  "function decimals() view returns (uint8)",

  "function totalSupply() view returns (uint256)",

  "function owner() view returns (address)",

  "function hiveAddress() view returns (address)",

  "function router() view returns (address)",

  "function pair() view returns (address)",

  "function pairLocked() view returns (bool)",

  "function BUY_TAX() view returns (uint256)",

  "function SELL_TAX() view returns (uint256)",

  "function TAX_DENOMINATOR() view returns (uint256)",

  "function swapThreshold() view returns (uint256)",

  "function isTaxExempt(address) view returns (bool)",

  "function balanceOf(address) view returns (uint256)"
];


/* =========================================================
   DISPLAY HELPER
   ========================================================= */

function line(
  name,
  value,
  pass
){

  return `
    <div style="margin-bottom:16px;">

      <strong>
      ${name}
      </strong>

      <br>

      ${value}

      <br>

      ${
        pass
        ?
        '<span class="good">PASS ✅</span>'
        :
        '<span class="bad">FAIL ❌</span>'
      }

    </div>
  `;
}


/* =========================================================
   VERIFY
   ========================================================= */

async function verify(){

  const results =
    document.getElementById(
      "results"
    );

  results.innerHTML =
    "Reading V4 contract...";


  try{

    const provider =
      new ethers.providers.JsonRpcProvider(
        RPC
      );


    /* -----------------------------
       VERIFY NETWORK
       ----------------------------- */

    const network =
      await provider.getNetwork();


    if(
      Number(network.chainId) !== 97
    ){

      throw new Error(
        "RPC is not BSC Testnet. Chain ID: " +
        network.chainId
      );
    }


    /* -----------------------------
       VERIFY CONTRACT EXISTS
       ----------------------------- */

    const code =
      await provider.getCode(
        TOKEN
      );


    if(
      !code ||
      code === "0x"
    ){

      throw new Error(
        "No contract bytecode found at V4 address."
      );
    }


    const token =
      new ethers.Contract(
        TOKEN,
        ABI,
        provider
      );


    /* -----------------------------
       READ V4
       ----------------------------- */

    const [
      name,
      symbol,
      decimals,
      totalSupply,
      owner,
      hive,
      router,
      pair,
      pairLocked,
      buyTax,
      sellTax,
      denominator,
      threshold
    ] =
    await Promise.all([

      token.name(),

      token.symbol(),

      token.decimals(),

      token.totalSupply(),

      token.owner(),

      token.hiveAddress(),

      token.router(),

      token.pair(),

      token.pairLocked(),

      token.BUY_TAX(),

      token.SELL_TAX(),

      token.TAX_DENOMINATOR(),

      token.swapThreshold()

    ]);


    const ownerExempt =
      await token.isTaxExempt(
        owner
      );


    const contractExempt =
      await token.isTaxExempt(
        TOKEN
      );


    const ownerBalance =
      await token.balanceOf(
        owner
      );


    /* -----------------------------
       EXPECTED VALUES
       ----------------------------- */

    const expectedSupply =
      ethers.utils.parseUnits(
        "1000000",
        18
      );


    const expectedThreshold =
      ethers.utils.parseUnits(
        "100",
        18
      );


    const ZERO =
      ethers.constants.AddressZero;


    let html = `
      <span class="good">
      BSC TESTNET VERIFIED ✅
      </span>

      <br><br>
    `;


    /* -----------------------------
       TOKEN INFO
       ----------------------------- */

    html += line(
      "Name",
      name,
      name === "Hive Token"
    );


    html += line(
      "Symbol",
      symbol,
      symbol === "HIVE"
    );


    html += line(
      "Decimals",
      decimals.toString(),
      Number(decimals) === 18
    );


    html += line(
      "Total Supply",
      ethers.utils.formatUnits(
        totalSupply,
        18
      ) + " HIVE",
      totalSupply.eq(
        expectedSupply
      )
    );


    /* -----------------------------
       OWNER
       ----------------------------- */

    html += line(
      "Owner",
      owner,
      owner !== ZERO
    );


    html += line(
      "Owner Tax Exempt",
      ownerExempt.toString(),
      ownerExempt === true
    );


    html += line(
      "HiveToken Contract Tax Exempt",
      contractExempt.toString(),
      contractExempt === true
    );


    html += line(
      "Owner Initial Balance",
      ethers.utils.formatUnits(
        ownerBalance,
        18
      ) + " HIVE",
      ownerBalance.eq(
        expectedSupply
      )
    );


    /* -----------------------------
       ROUTER + HIVE RECEIVER
       ----------------------------- */

    html += line(
      "PancakeSwap Testnet Router",
      router,
      router.toLowerCase() ===
      EXPECTED_ROUTER.toLowerCase()
    );


    html += line(
      "V4 Test Hive Receiver",
      hive,
      hive.toLowerCase() ===
      EXPECTED_HIVE.toLowerCase()
    );


    /* -----------------------------
       TAX
       ----------------------------- */

    html += line(
      "Buy Tax",
      buyTax.toString() +
      " / " +
      denominator.toString() +
      " = 2.5%",
      buyTax.eq(250) &&
      denominator.eq(10000)
    );


    html += line(
      "Sell Tax",
      sellTax.toString() +
      " / " +
      denominator.toString() +
      " = 2.5%",
      sellTax.eq(250) &&
      denominator.eq(10000)
    );


    /* -----------------------------
       SWAP THRESHOLD
       ----------------------------- */

    html += line(
      "Swap Threshold",
      ethers.utils.formatUnits(
        threshold,
        18
      ) + " HIVE",
      threshold.eq(
        expectedThreshold
      )
    );


    /* -----------------------------
       PAIR
       ----------------------------- */

    html += line(
      "Pair Address",
      pair,
      pair === ZERO
    );


    html += line(
      "Pair Locked",
      pairLocked.toString(),
      pairLocked === false
    );


    /* -----------------------------
       FINAL
       ----------------------------- */

    const allPass =

      name === "Hive Token" &&

      symbol === "HIVE" &&

      Number(decimals) === 18 &&

      totalSupply.eq(
        expectedSupply
      ) &&

      owner !== ZERO &&

      ownerExempt === true &&

      contractExempt === true &&

      ownerBalance.eq(
        expectedSupply
      ) &&

      router.toLowerCase() ===
      EXPECTED_ROUTER.toLowerCase() &&

      hive.toLowerCase() ===
      EXPECTED_HIVE.toLowerCase() &&

      buyTax.eq(250) &&

      sellTax.eq(250) &&

      denominator.eq(10000) &&

      threshold.eq(
        expectedThreshold
      ) &&

      pair === ZERO &&

      pairLocked === false;


    if(allPass){

      html += `
        <hr>

        <span class="good">
        ALL V4 CHECKS PASSED ✅
        </span>

        <br><br>

        V4 is ready for the next testnet step:

        <br><br>

        <strong>
        Create/find HIVE-WBNB pair and configure it.
        </strong>

        <br><br>

        No transaction was sent by this verification.
      `;

    }else{

      html += `
        <hr>

        <span class="bad">
        ONE OR MORE CHECKS FAILED ❌
        </span>

        <br><br>

        Stop here and send a screenshot.
      `;
    }


    results.innerHTML =
      html;


  }catch(error){

    results.innerHTML = `
      <span class="bad">
      VERIFICATION ERROR ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}

</script>

</body>
</html>
