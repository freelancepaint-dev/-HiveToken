<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveToken V3 Tax Test</title>

<style>
body {
  background:#0b0f0b;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}
.card {
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1 { color:#ffd45c; }
.box {
  background:#050705;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.6;
}
button {
  width:100%;
  padding:17px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}
.connect {
  background:#eee;
  color:#111;
}
.buy {
  background:#ffd45c;
  color:#111;
}
.good {
  color:#55ef7a;
  font-weight:bold;
}
.bad {
  color:#ff5c5c;
  font-weight:bold;
}
.label { color:#aaa; }
</style>
</head>

<body>

<div class="card">

<h1>HiveToken V3 Tax Test</h1>

<p>
BSC Testnet only. This test buys exactly
<strong>0.001 tBNB</strong> of HIVE.
</p>

<div class="box">
<span class="label">HiveToken V3</span><br>
0xf10f0091a7504761e5e0cab7a7de34df077871f8
</div>

<div class="box">
<span class="label">HIVE Recipient — LOCKED</span><br>
0x77Dc64A638100407F756393dF33640d5cDf45619
<br><br>
<span class="good">Confirmed non-tax-exempt ✅</span>
</div>

<div class="box">
<span class="label">Test Amount</span><br>
0.001 tBNB
</div>

<button class="connect" onclick="connectWallet()">
1. Connect + Confirm BSC Testnet
</button>

<button class="buy" onclick="testBuy()">
2. Test 0.001 tBNB Buy
</button>

<div id="status" class="box">
Ready.
</div>

</div>

<script>

const ROUTER =
"0xD99D1c33F9fC3444f8101754aBC46c52416550D1";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";

const HIVE =
"0xf10f0091a7504761e5e0cab7a7de34df077871f8";

const RECIPIENT =
"0x77Dc64A638100407F756393dF33640d5cDf45619";

const CHAIN_ID = "0x61";

const BUY_VALUE =
"0x38d7ea4c68000"; // exactly 0.001 BNB

let connectedAccount = null;


/* --------------------------------
   CONNECT
-------------------------------- */

async function connectWallet() {

  const status =
    document.getElementById("status");

  try {

    if (!window.ethereum) {
      throw new Error(
        "Open this page inside your wallet browser."
      );
    }

    const accounts =
      await window.ethereum.request({
        method:"eth_requestAccounts"
      });

    connectedAccount = accounts[0];

    let chain =
      await window.ethereum.request({
        method:"eth_chainId"
      });

    if (chain.toLowerCase() !== CHAIN_ID) {

      await window.ethereum.request({
        method:"wallet_switchEthereumChain",
        params:[
          { chainId:CHAIN_ID }
        ]
      });

      chain =
        await window.ethereum.request({
          method:"eth_chainId"
        });
    }

    if (chain.toLowerCase() !== CHAIN_ID) {
      throw new Error(
        "Wallet is not on BSC Testnet."
      );
    }

    status.innerHTML = `
      <span class="good">
      BSC Testnet confirmed ✅
      </span>

      <br><br>

      <span class="label">
      Transaction-paying wallet
      </span><br>

      ${connectedAccount}

      <br><br>

      <span class="label">
      HIVE will be sent to
      </span><br>

      ${RECIPIENT}
    `;

  } catch(error) {

    status.innerHTML =
      "<span class='bad'>ERROR</span><br>" +
      error.message;
  }
}


/* --------------------------------
   ABI HELPERS
-------------------------------- */

function strip0x(value) {
  return value.toLowerCase().replace("0x","");
}

function encodeUint(value) {

  return BigInt(value)
    .toString(16)
    .padStart(64,"0");
}

function encodeAddress(address) {

  return strip0x(address)
    .padStart(64,"0");
}


/* --------------------------------
   BUY
-------------------------------- */

async function testBuy() {

  const status =
    document.getElementById("status");

  try {

    if (!window.ethereum) {
      throw new Error("Wallet provider not found.");
    }

    if (!connectedAccount) {
      throw new Error(
        "Tap Connect + Confirm BSC Testnet first."
      );
    }

    const chain =
      await window.ethereum.request({
        method:"eth_chainId"
      });

    if (chain.toLowerCase() !== CHAIN_ID) {
      throw new Error(
        "STOP — wallet is not on BSC Testnet."
      );
    }


    /*
      PancakeSwap V2:

      swapExactETHForTokensSupportingFeeOnTransferTokens(
        uint amountOutMin,
        address[] path,
        address to,
        uint deadline
      )

      selector:
      0xb6f9de95
    */


    const selector =
      "b6f9de95";


    /*
      ABI head:

      amountOutMin = 0

      path offset = 0x80
      because the static head is 4 x 32 bytes

      to = locked non-exempt recipient

      deadline = now + 20 minutes
    */


    const amountOutMin =
      encodeUint(0);

    const pathOffset =
      encodeUint(128);

    const recipient =
      encodeAddress(RECIPIENT);

    const deadline =
      encodeUint(
        Math.floor(Date.now()/1000) + 1200
      );


    /*
      Dynamic path:

      length = 2
      path[0] = WBNB
      path[1] = HIVE
    */


    const pathLength =
      encodeUint(2);

    const path0 =
      encodeAddress(WBNB);

    const path1 =
      encodeAddress(HIVE);


    const data =
      "0x" +
      selector +
      amountOutMin +
      pathOffset +
      recipient +
      deadline +
      pathLength +
      path0 +
      path1;


    status.innerHTML = `
      <span class="good">
      Ready to request wallet confirmation.
      </span>

      <br><br>

      Amount: 0.001 tBNB

      <br><br>

      HIVE recipient:<br>
      ${RECIPIENT}
    `;


    const txHash =
      await window.ethereum.request({

        method:"eth_sendTransaction",

        params:[
          {
            from:connectedAccount,
            to:ROUTER,
            value:BUY_VALUE,
            data:data
          }
        ]
      });


    status.innerHTML = `
      <span class="good">
      Transaction submitted ✅
      </span>

      <br><br>

      <span class="label">
      Transaction Hash
      </span><br>

      ${txHash}

      <br><br>

      Wait for confirmation, then send me
      the transaction hash or BscScan screenshot.
    `;


  } catch(error) {

    status.innerHTML =
      "<span class='bad'>TRANSACTION NOT SUBMITTED</span>" +
      "<br><br>" +
      error.message;
  }
}

</script>

</body>
</html>
