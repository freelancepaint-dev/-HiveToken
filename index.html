<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Deploy HiveToken V4</title>

<style>

body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}

h1{
  color:#ffd45c;
}

.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.6;
}

button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:0.5;
}

.good{
  color:#55ef7a;
  font-weight:bold;
}

.bad{
  color:#ff5c5c;
  font-weight:bold;
}

.warning{
  color:#ffd45c;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h1>🐝 Deploy HiveToken V4</h1>

<div class="box">

<strong>TESTNET ONLY</strong>

<br><br>

Network:<br>
BNB Smart Chain Testnet

<br><br>

Chain ID:<br>
97

</div>


<div class="box">

<strong>PancakeSwap Testnet Router</strong>

<br><br>

0xD99D1c33F9fC3444f8101754aBC46c52416550D1

</div>


<div class="box">

<strong>V4 Test Hive Receiver</strong>

<br><br>

0xd22d8d7a8a3a3a7293168b5c83413060fd11ece1

</div>


<button onclick="connectWallet()">
Connect Wallet
</button>


<button
  id="deployButton"
  onclick="deployHiveToken()"
  disabled
>
Deploy HiveToken V4
</button>


<div
  id="status"
  class="box"
>
Ready.
</div>

</div>


<!-- HiveToken V4 creation bytecode -->
<script src="hive-bytecode.js"></script>


<!-- ethers used only to encode constructor arguments -->
<script
  src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
</script>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const ROUTER =
  "0xD99D1c33F9fC3444f8101754aBC46c52416550D1";

const HIVE_RECEIVER =
  "0xd22d8d7a8a3a3a7293168b5c83413060fd11ece1";

let account =
  null;


/* =========================================================
   WALLET PROVIDER
   ========================================================= */

function getProvider(){

  if(
    typeof window.ethereum !== "undefined"
  ){
    return window.ethereum;
  }

  throw new Error(
    "Wallet provider not found. Open this page inside your wallet browser."
  );
}


/* =========================================================
   VERIFY BSC TESTNET
   ========================================================= */

async function requireTestnet(){

  const chainId =
    await getProvider().request({
      method:"eth_chainId"
    });


  if(
    chainId.toLowerCase() !== "0x61"
  ){

    throw new Error(
      "Wrong network. Switch to BNB Smart Chain Testnet (Chain ID 97)."
    );
  }


  return chainId;
}


/* =========================================================
   CONNECT WALLET
   ========================================================= */

async function connectWallet(){

  const status =
    document.getElementById(
      "status"
    );

  const deployButton =
    document.getElementById(
      "deployButton"
    );


  try{

    status.innerHTML =
      "Connecting...";


    await requireTestnet();


    const accounts =
      await getProvider().request({
        method:
          "eth_requestAccounts"
      });


    if(
      !accounts ||
      accounts.length === 0
    ){

      throw new Error(
        "No wallet account returned."
      );
    }


    account =
      accounts[0];


    status.innerHTML = `
      <span class="good">
      Connected ✅
      </span>

      <br><br>

      BSC Testnet

      <br><br>

      Wallet:

      <br>

      ${account}

      <br><br>

      <strong>
      Ready to deploy HiveToken V4.
      </strong>
    `;


    deployButton.disabled =
      false;


  }catch(error){

    account =
      null;

    deployButton.disabled =
      true;


    status.innerHTML = `
      <span class="bad">
      Connection failed ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* =========================================================
   DEPLOY HIVETOKEN V4
   ========================================================= */

async function deployHiveToken(){

  const status =
    document.getElementById(
      "status"
    );

  const deployButton =
    document.getElementById(
      "deployButton"
    );


  try{

    if(!account){

      throw new Error(
        "Connect wallet first."
      );
    }


    await requireTestnet();


    /*
      Verify compiled V4 bytecode loaded.
    */

    if(
      typeof window.HIVE_BYTECODE
        !== "string" ||
      !window.HIVE_BYTECODE
        .startsWith("0x") ||
      window.HIVE_BYTECODE
        .length < 10
    ){

      throw new Error(
        "HiveToken V4 bytecode was not loaded."
      );
    }


    /*
      Encode constructor:

      constructor(
        address routerAddress,
        address payable hiveFundingAddress
      )
    */

    const encodedArgs =
      ethers.utils.defaultAbiCoder.encode(
        [
          "address",
          "address"
        ],
        [
          ROUTER,
          HIVE_RECEIVER
        ]
      );


    /*
      Creation bytecode + constructor args.
    */

    const deploymentData =
      window.HIVE_BYTECODE +
      encodedArgs.slice(2);


    deployButton.disabled =
      true;


    status.innerHTML = `
      <span class="warning">
      Waiting for wallet...
      </span>

      <br><br>

      Review the TESTNET deployment.

      <br><br>

      Network must show:

      <br>

      <strong>
      BNB Smart Chain Testnet
      </strong>

      <br><br>

      Do NOT approve if your wallet shows
      BSC Mainnet.
    `;


    /*
      Deploy contract.

      No "to" address because this is
      contract creation.
    */

    const txHash =
      await getProvider().request({

        method:
          "eth_sendTransaction",

        params:[
          {
            from:
              account,

            data:
              deploymentData,

            value:
              "0x0"
          }
        ]

      });


    status.innerHTML = `
      <span class="good">
      Deployment sent ✅
      </span>

      <br><br>

      Transaction:

      <br><br>

      ${txHash}

      <br><br>

      Waiting for confirmation...
    `;


    /*
      Wait for transaction receipt.
    */

    let receipt =
      null;


    while(!receipt){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            2500
          )
      );


      receipt =
        await getProvider().request({

          method:
            "eth_getTransactionReceipt",

          params:[
            txHash
          ]

        });

    }


    /*
      Confirm successful execution.
    */

    if(
      receipt.status &&
      receipt.status.toLowerCase()
        !== "0x1"
    ){

      throw new Error(
        "HiveToken deployment reverted."
      );
    }


    if(
      !receipt.contractAddress
    ){

      throw new Error(
        "Deployment confirmed but no HiveToken contract address was returned."
      );
    }


    status.innerHTML = `
      <span class="good">
      HIVETOKEN V4 DEPLOYED ✅
      </span>

      <br><br>

      <strong>
      HiveToken V4:
      </strong>

      <br><br>

      ${receipt.contractAddress}

      <br><br>

      <strong>
      Transaction:
      </strong>

      <br><br>

      ${txHash}

      <br><br>

      Router:

      <br>

      ${ROUTER}

      <br><br>

      Test Hive Receiver:

      <br>

      ${HIVE_RECEIVER}

      <br><br>

      <strong>
      Stop here after deployment.
      </strong>

      <br><br>

      Do not add liquidity yet.
      We will verify V4 first.
    `;


  }catch(error){

    deployButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      Deployment failed ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* =========================================================
   WALLET CHANGES
   ========================================================= */

if(
  typeof window.ethereum !== "undefined"
){

  window.ethereum.on(
    "accountsChanged",
    function(){

      account =
        null;

      document.getElementById(
        "deployButton"
      ).disabled =
        true;

      document.getElementById(
        "status"
      ).innerHTML =
        "Wallet changed. Connect again.";
    }
  );


  window.ethereum.on(
    "chainChanged",
    function(){

      account =
        null;

      document.getElementById(
        "deployButton"
      ).disabled =
        true;

      document.getElementById(
        "status"
      ).innerHTML =
        "Network changed. Connect again.";
    }
  );

}

</script>

</body>
</html>
