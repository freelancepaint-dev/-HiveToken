<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveToken V4 Pair Setup</title>

<style>
body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1{color:#ffd45c;}
.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}
button{
  width:100%;
  padding:18px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}
button:disabled{opacity:.45;}
.good{color:#55ef7a;font-weight:bold;}
.bad{color:#ff5c5c;font-weight:bold;}
.warning{color:#ffd45c;font-weight:bold;}
</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Pair Setup</h1>

<div class="box">
<strong>TESTNET ONLY</strong><br><br>

HiveToken V4:<br>
0x305cecf060209f758b74dbef91758021f113c608

<br><br>

WBNB:<br>
0xae13d989dac2f0debff460ac112a837c89baa7cd

<br><br>

PancakeSwap V2 Factory:<br>
0x6725F303b657a9451d8BA641348b6761a6cc7a17
</div>

<button onclick="connectWallet()">
1. Connect Wallet
</button>

<button
  id="createButton"
  onclick="createOrFindPair()"
  disabled
>
2. Create / Find V4 HIVE-WBNB Pair
</button>

<button
  id="setButton"
  onclick="setPair()"
  disabled
>
3. Permanently Set Pair in HiveToken
</button>

<div id="status" class="box">
Ready.
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script>

const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";

const FACTORY =
"0x6725F303b657a9451d8BA641348b6761a6cc7a17";

const ZERO =
"0x0000000000000000000000000000000000000000";

let account = null;
let pairAddress = null;


/* ==============================================
   PROVIDER
   ============================================== */

function getEthereum(){

  if(!window.ethereum){
    throw new Error(
      "Wallet provider not found. Open this page inside your wallet browser."
    );
  }

  return window.ethereum;
}


/* ==============================================
   NETWORK CHECK
   ============================================== */

async function requireTestnet(){

  const chainId =
    await getEthereum().request({
      method:"eth_chainId"
    });

  if(chainId.toLowerCase() !== "0x61"){
    throw new Error(
      "Wrong network. Use BNB Smart Chain Testnet — Chain ID 97."
    );
  }
}


/* ==============================================
   ETHERS SIGNER
   ============================================== */

function signer(){

  const provider =
    new ethers.providers.Web3Provider(
      getEthereum()
    );

  return provider.getSigner();
}


/* ==============================================
   CONNECT
   ============================================== */

async function connectWallet(){

  const status =
    document.getElementById("status");

  try{

    await requireTestnet();

    const accounts =
      await getEthereum().request({
        method:"eth_requestAccounts"
      });

    if(!accounts || !accounts.length){
      throw new Error(
        "No wallet account returned."
      );
    }

    account =
      accounts[0];


    /*
      Verify this wallet is the V4 owner.
    */

    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function owner() view returns(address)",
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)"
        ],
        signer()
      );


    const owner =
      await token.owner();

    const currentPair =
      await token.pair();

    const locked =
      await token.pairLocked();


    if(
      owner.toLowerCase() !==
      account.toLowerCase()
    ){
      throw new Error(
        "Connected wallet is not the HiveToken V4 owner."
      );
    }


    if(locked){

      status.innerHTML = `
        <span class="good">
        Pair already configured ✅
        </span>

        <br><br>

        ${currentPair}

        <br><br>

        No further pair setup is needed.
      `;

      return;
    }


    document.getElementById(
      "createButton"
    ).disabled = false;


    status.innerHTML = `
      <span class="good">
      OWNER CONNECTED ✅
      </span>

      <br><br>

      ${account}

      <br><br>

      BSC Testnet confirmed.

      <br><br>

      Pair is currently unset.

      <br><br>

      Press:

      <br>

      <strong>
      2. Create / Find V4 HIVE-WBNB Pair
      </strong>
    `;


  }catch(error){

    status.innerHTML = `
      <span class="bad">
      CONNECTION FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* ==============================================
   FACTORY
   ============================================== */

async function createOrFindPair(){

  const status =
    document.getElementById("status");

  const createButton =
    document.getElementById(
      "createButton"
    );


  try{

    await requireTestnet();

    createButton.disabled = true;


    const factory =
      new ethers.Contract(
        FACTORY,
        [
          "function getPair(address,address) view returns(address)",
          "function createPair(address,address) returns(address)"
        ],
        signer()
      );


    /*
      First check whether V4 already has a pair.
    */

    let existing =
      await factory.getPair(
        TOKEN,
        WBNB
      );


    if(
      existing.toLowerCase() !==
      ZERO.toLowerCase()
    ){

      pairAddress =
        existing;


      document.getElementById(
        "setButton"
      ).disabled = false;


      status.innerHTML = `
        <span class="good">
        V4 PAIR FOUND ✅
        </span>

        <br><br>

        Pair:

        <br><br>

        ${pairAddress}

        <br><br>

        This pair was returned directly by
        the PancakeSwap V2 factory for:

        <br><br>

        HiveToken V4 + WBNB

        <br><br>

        <strong>
        Next press button 3 to permanently
        set this pair in HiveToken.
        </strong>
      `;

      return;
    }


    /*
      No pair exists.

      Create the pair through the factory.
    */

    status.innerHTML = `
      <span class="warning">
      No V4 pair exists yet.
      </span>

      <br><br>

      Your wallet will now ask you to
      approve creation of the V4
      HIVE-WBNB pair.

      <br><br>

      TESTNET ONLY.
    `;


    const tx =
      await factory.createPair(
        TOKEN,
        WBNB
      );


    status.innerHTML = `
      Pair creation sent ✅

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    /*
      Do not trust an event or guessed address.

      Ask the factory again for the canonical
      pair after the transaction confirms.
    */

    existing =
      await factory.getPair(
        TOKEN,
        WBNB
      );


    if(
      existing.toLowerCase() ===
      ZERO.toLowerCase()
    ){
      throw new Error(
        "Pair creation confirmed, but factory returned zero address."
      );
    }


    pairAddress =
      existing;


    document.getElementById(
      "setButton"
    ).disabled = false;


    status.innerHTML = `
      <span class="good">
      V4 HIVE-WBNB PAIR CREATED ✅
      </span>

      <br><br>

      <strong>
      Pair Address:
      </strong>

      <br><br>

      ${pairAddress}

      <br><br>

      Factory:

      <br>

      ${FACTORY}

      <br><br>

      <strong>
      STOP AND CHECK THE ADDRESS ABOVE.
      </strong>

      <br><br>

      Button 3 is now enabled.

      <br><br>

      Pressing button 3 will permanently
      lock this pair into HiveToken V4.
    `;


  }catch(error){

    createButton.disabled = false;

    status.innerHTML = `
      <span class="bad">
      PAIR CREATION FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* ==============================================
   SET + LOCK PAIR
   ============================================== */

async function setPair(){

  const status =
    document.getElementById("status");

  const setButton =
    document.getElementById(
      "setButton"
    );


  try{

    await requireTestnet();


    if(!pairAddress){
      throw new Error(
        "No verified pair address loaded."
      );
    }


    /*
      Recheck factory immediately before
      permanent setPair().
    */

    const factory =
      new ethers.Contract(
        FACTORY,
        [
          "function getPair(address,address) view returns(address)"
        ],
        signer()
      );


    const verifiedPair =
      await factory.getPair(
        TOKEN,
        WBNB
      );


    if(
      verifiedPair.toLowerCase() !==
      pairAddress.toLowerCase()
    ){
      throw new Error(
        "Factory pair verification failed. Pair will NOT be locked."
      );
    }


    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function setPair(address)",
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)"
        ],
        signer()
      );


    setButton.disabled = true;


    status.innerHTML = `
      <span class="warning">
      FINAL PAIR CONFIGURATION
      </span>

      <br><br>

      Pair verified directly with factory:

      <br><br>

      ${verifiedPair}

      <br><br>

      Your wallet will ask you to approve
      HiveToken.setPair().

      <br><br>

      This setting is permanent.
    `;


    const tx =
      await token.setPair(
        verifiedPair
      );


    status.innerHTML = `
      Pair configuration sent ✅

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    const savedPair =
      await token.pair();

    const locked =
      await token.pairLocked();


    if(
      !locked ||
      savedPair.toLowerCase() !==
      verifiedPair.toLowerCase()
    ){
      throw new Error(
        "Post-transaction pair verification failed."
      );
    }


    status.innerHTML = `
      <span class="good">
      V4 PAIR CONFIGURED & LOCKED ✅
      </span>

      <br><br>

      <strong>
      HIVE-WBNB Pair:
      </strong>

      <br><br>

      ${savedPair}

      <br><br>

      Pair Locked:

      <br>

      ${locked}

      <br><br>

      <strong>
      STOP HERE.
      </strong>

      <br><br>

      Do not add liquidity yet.

      <br><br>

      Send me a screenshot of this result.
    `;


  }catch(error){

    setButton.disabled = false;

    status.innerHTML = `
      <span class="bad">
      SET PAIR FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* ==============================================
   WALLET CHANGES
   ============================================== */

if(window.ethereum){

  window.ethereum.on(
    "accountsChanged",
    function(){
      location.reload();
    }
  );

  window.ethereum.on(
    "chainChanged",
    function(){
      location.reload();
    }
  );

}

</script>

</body>
</html>
