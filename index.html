<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
HiveToken V4 Buy Tax Test
</title>


<style>

body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}

h1{
  color:#ffd45c;
}

.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}

button{
  width:100%;
  padding:18px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.good{
  color:#55ef7a;
  font-weight:bold;
}

.bad{
  color:#ff5c5c;
  font-weight:bold;
}

.warning{
  color:#ffd45c;
  font-weight:bold;
}

</style>

</head>


<body>


<div class="card">


<h1>
🐝 HiveToken V4 Buy Tax Test
</h1>


<div class="box">

<strong>
TESTNET ONLY
</strong>

<br><br>

Buy amount:

<br>

<strong>
0.001 tBNB
</strong>

<br><br>

Expected HIVE buy tax:

<br>

<strong>
2.5%
</strong>

</div>


<div class="box">

<strong>
HiveToken V4
</strong>

<br><br>

0x305cecf060209f758b74dbef91758021f113c608

<br><br>

<strong>
V4 HIVE/WBNB Pair
</strong>

<br><br>

0x3f8016dea6df1323fe2bee493b15593a8a2b149e

</div>


<button
  onclick="connectWallet()"
>
1. Connect Buyer Wallet
</button>


<button
  id="buyButton"
  onclick="runBuyTest()"
  disabled
>
2. Buy HIVE With 0.001 tBNB
</button>


<div
  id="status"
  class="box"
>
Ready.
</div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
</script>


<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */


const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";


const PAIR =
"0x3f8016dea6df1323fe2bee493b15593a8a2b149e";


const ROUTER =
"0xd99d1c33f9fc3444f8101754abc46c52416550d1";


const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";


const BUY_AMOUNT =
ethers.utils.parseEther(
  "0.001"
);


let account =
  null;



/* =========================================================
   WALLET PROVIDER
   ========================================================= */


function getEthereum(){

  if(
    typeof window.ethereum === "undefined"
  ){

    throw new Error(
      "Wallet provider not found. Open this page inside your wallet browser."
    );

  }


  if(
    typeof window.ethereum.request !==
    "function"
  ){

    throw new Error(
      "Wallet provider does not support request()."
    );

  }


  return window.ethereum;

}



function getProvider(){

  return new ethers.providers.Web3Provider(
    getEthereum()
  );

}



function getSigner(){

  return getProvider().getSigner();

}



/* =========================================================
   VERIFY BSC TESTNET
   ========================================================= */


async function requireTestnet(){

  const wallet =
    getEthereum();


  const chainId =
    await wallet.request({

      method:
        "eth_chainId"

    });


  if(
    chainId.toLowerCase() !==
    "0x61"
  ){

    throw new Error(
      "Wrong network. Use BNB Smart Chain Testnet — Chain ID 97."
    );

  }


  return chainId;

}



/* =========================================================
   CONNECT BUYER WALLET
   ========================================================= */


async function connectWallet(){

  const status =
    document.getElementById(
      "status"
    );


  const buyButton =
    document.getElementById(
      "buyButton"
    );


  try{


    buyButton.disabled =
      true;


    status.innerHTML =
      "Checking wallet...";


    /*
      Verify network.
    */

    await requireTestnet();


    /*
      Request wallet account.
    */

    const accounts =
      await getEthereum().request({

        method:
          "eth_requestAccounts"

      });


    if(
      !accounts ||
      accounts.length === 0
    ){

      throw new Error(
        "No wallet account returned."
      );

    }


    account =
      accounts[0];


    /*
      Load HiveToken read-only.
    */

    const token =
      new ethers.Contract(

        TOKEN,

        [

          "function owner() view returns(address)",

          "function isTaxExempt(address) view returns(bool)",

          "function pair() view returns(address)",

          "function pairLocked() view returns(bool)",

          "function balanceOf(address) view returns(uint256)"

        ],

        getProvider()

      );


    /*
      Verify this is NOT owner.
    */

    const owner =
      await token.owner();


    if(
      account.toLowerCase() ===
      owner.toLowerCase()
    ){

      throw new Error(
        "This is the HiveToken owner wallet. Switch to the second non-owner test wallet."
      );

    }


    /*
      Verify buyer is NOT tax exempt.
    */

    const exempt =
      await token.isTaxExempt(
        account
      );


    if(exempt){

      throw new Error(
        "This wallet is tax exempt. Use the non-exempt test wallet."
      );

    }


    /*
      Verify pair.
    */

    const configuredPair =
      await token.pair();


    const pairLocked =
      await token.pairLocked();


    if(
      !pairLocked
    ){

      throw new Error(
        "HiveToken pair is not locked."
      );

    }


    if(
      configuredPair.toLowerCase() !==
      PAIR.toLowerCase()
    ){

      throw new Error(
        "HiveToken pair does not match the expected V4 pair."
      );

    }


    /*
      Verify pair contains contract code.
    */

    const pairCode =
      await getProvider().getCode(
        PAIR
      );


    if(
      !pairCode ||
      pairCode === "0x"
    ){

      throw new Error(
        "No contract code found at V4 pair address."
      );

    }


    /*
      Verify buyer has enough tBNB.
    */

    const bnbBalance =
      await getProvider().getBalance(
        account
      );


    if(
      bnbBalance.lte(
        BUY_AMOUNT
      )
    ){

      throw new Error(
        "Buyer needs more than 0.001 tBNB for the test buy plus gas."
      );

    }


    /*
      Display current buyer HIVE balance.
    */

    const hiveBalance =
      await token.balanceOf(
        account
      );


    buyButton.disabled =
      false;


    status.innerHTML = `

      <span class="good">
      BUYER READY ✅
      </span>

      <br><br>

      <strong>
      Buyer:
      </strong>

      <br><br>

      ${account}

      <br><br>

      Non-owner:

      <br>

      <span class="good">
      VERIFIED ✅
      </span>

      <br><br>

      Tax exempt:

      <br>

      false

      <br>

      <span class="good">
      VERIFIED ✅
      </span>

      <br><br>

      V4 pair:

      <br>

      ${configuredPair}

      <br>

      <span class="good">
      VERIFIED ✅
      </span>

      <br><br>

      Current HIVE balance:

      <br>

      ${ethers.utils.formatUnits(
        hiveBalance,
        18
      )} HIVE

      <br><br>

      <strong>
      Ready for the 0.001 tBNB buy.
      </strong>

    `;


  }catch(error){


    account =
      null;


    buyButton.disabled =
      true;


    status.innerHTML = `

      <span class="bad">
      BUYER CHECK FAILED ❌
      </span>

      <br><br>

      ${error.message}

    `;

  }

}



/* =========================================================
   RUN BUY TAX TEST
   ========================================================= */


async function runBuyTest(){

  const status =
    document.getElementById(
      "status"
    );


  const buyButton =
    document.getElementById(
      "buyButton"
    );


  try{


    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect the buyer wallet first."
      );

    }


    buyButton.disabled =
      true;


    /*
      Token read contract.
    */

    const token =
      new ethers.Contract(

        TOKEN,

        [

          "function balanceOf(address) view returns(uint256)",

          "function isTaxExempt(address) view returns(bool)"

        ],

        getProvider()

      );


    /*
      Recheck buyer exemption immediately
      before transaction.
    */

    const exempt =
      await token.isTaxExempt(
        account
      );


    if(exempt){

      throw new Error(
        "Buyer became tax exempt. Stop test."
      );

    }


    /*
      Record balances BEFORE buy.
    */

    const buyerBefore =
      await token.balanceOf(
        account
      );


    const taxBefore =
      await token.balanceOf(
        TOKEN
      );


    const pairBefore =
      await token.balanceOf(
        PAIR
      );


    /*
      Router contract.
    */

    const router =
      new ethers.Contract(

        ROUTER,

        [

          "function swapExactETHForTokensSupportingFeeOnTransferTokens(uint256 amountOutMin,address[] calldata path,address to,uint256 deadline) payable"

        ],

        getSigner()

      );


    /*
      Deadline = current block time
      + 20 minutes.
    */

    const block =
      await getProvider().getBlock(
        "latest"
      );


    const deadline =
      block.timestamp +
      1200;


    const path =
      [

        WBNB,

        TOKEN

      ];


    status.innerHTML = `

      <span class="warning">
      BUY TAX TEST
      </span>

      <br><br>

      Your wallet will ask you to swap:

      <br><br>

      <strong>
      0.001 tBNB
      </strong>

      <br>

      ↓

      <br>

      <strong>
      HIVE
      </strong>

      <br><br>

      TESTNET ONLY.

    `;


    /*
      Perform buy.

      amountOutMin = 0 for this controlled
      testnet functional test.
    */

    const tx =
      await router
        .swapExactETHForTokensSupportingFeeOnTransferTokens(

          0,

          path,

          account,

          deadline,

          {

            value:
              BUY_AMOUNT

          }

        );


    status.innerHTML = `

      <span class="good">
      BUY SENT ✅
      </span>

      <br><br>

      Transaction:

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...

    `;


    await tx.wait();


    /*
      Read balances AFTER transaction.
    */

    const buyerAfter =
      await token.balanceOf(
        account
      );


    const taxAfter =
      await token.balanceOf(
        TOKEN
      );


    const pairAfter =
      await token.balanceOf(
        PAIR
      );


    /*
      Calculate actual movements.
    */

    const buyerReceived =
      buyerAfter.sub(
        buyerBefore
      );


    const taxCollected =
      taxAfter.sub(
        taxBefore
      );


    const grossPairSent =
      pairBefore.sub(
        pairAfter
      );


    /*
      Exact contract formula:

      amount * 250 / 10000
    */

    const expectedTax =
      grossPairSent
        .mul(250)
        .div(10000);


    const expectedBuyer =
      grossPairSent.sub(
        expectedTax
      );


    const taxPass =
      taxCollected.eq(
        expectedTax
      );


    const buyerPass =
      buyerReceived.eq(
        expectedBuyer
      );


    /*
      Calculate displayed percentage.
    */

    let displayedPercent =
      "0";


    if(
      !grossPairSent.eq(0)
    ){

      const scaledPercent =
        taxCollected
          .mul(1000000)
          .div(grossPairSent);


      displayedPercent =
        (
          Number(
            scaledPercent.toString()
          ) / 10000
        ).toFixed(4);

    }


    /*
      PASS
    */

    if(
      taxPass &&
      buyerPass
    ){

      status.innerHTML = `

        <span class="good">
        V4 BUY TAX PASSED ✅
        </span>

        <br><br>

        <strong>
        Gross HIVE sent by pair:
        </strong>

        <br><br>

        ${ethers.utils.formatUnits(
          grossPairSent,
          18
        )} HIVE

        <br><br>

        <strong>
        Buyer received:
        </strong>

        <br><br>

        ${ethers.utils.formatUnits(
          buyerReceived,
          18
        )} HIVE

        <br><br>

        <strong>
        HIVE tax collected:
        </strong>

        <br><br>

        ${ethers.utils.formatUnits(
          taxCollected,
          18
        )} HIVE

        <br><br>

        <strong>
        Expected tax:
        </strong>

        <br><br>

        ${ethers.utils.formatUnits(
          expectedTax,
          18
        )} HIVE

        <br><br>

        <strong>
        Measured tax rate:
        </strong>

        <br><br>

        ${displayedPercent}%

        <br><br>

        <span class="good">
        EXACT 2.5% BUY TAX VERIFIED ✅
        </span>

        <br><br>

        <strong>
        STOP HERE.
        </strong>

        <br><br>

        Do not sell yet.

        <br><br>

        Send me a screenshot of this result.

      `;


    }else{


      status.innerHTML = `

        <span class="bad">
        BUY TAX CHECK FAILED ❌
        </span>

        <br><br>

        Gross HIVE sent by pair:

        <br><br>

        ${ethers.utils.formatUnits(
          grossPairSent,
          18
        )} HIVE

        <br><br>

        Buyer received:

        <br><br>

        ${ethers.utils.formatUnits(
          buyerReceived,
          18
        )} HIVE

        <br><br>

        Actual tax collected:

        <br><br>

        ${ethers.utils.formatUnits(
          taxCollected,
          18
        )} HIVE

        <br><br>

        Expected tax:

        <br><br>

        ${ethers.utils.formatUnits(
          expectedTax,
          18
        )} HIVE

        <br><br>

        <strong>
        STOP HERE.
        </strong>

      `;

    }


  }catch(error){


    buyButton.disabled =
      false;


    status.innerHTML = `

      <span class="bad">
      BUY TEST FAILED ❌
      </span>

      <br><br>

      ${error.message}

    `;

  }

}



/* =========================================================
   WALLET CHANGES
   ========================================================= */


if(
  typeof window.ethereum !==
  "undefined"
){

  window.ethereum.on(

    "accountsChanged",

    function(){

      location.reload();

    }

  );


  window.ethereum.on(

    "chainChanged",

    function(){

      location.reload();

    }

  );

}


</script>


</body>

</html>
