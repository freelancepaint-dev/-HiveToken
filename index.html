<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>HiveToken V4 Test Receiver</title>

<style>

body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}

h1{
  color:#ffd45c;
}

.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.6;
}

button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:0.5;
}

.good{
  color:#55ef7a;
  font-weight:bold;
}

.bad{
  color:#ff5c5c;
  font-weight:bold;
}

.warning{
  color:#ffd45c;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Test Receiver</h1>

<div class="box">

<strong>TESTNET ONLY</strong>

<br><br>

This deploys the temporary
TestHiveReceiver contract used to test
HiveToken V4.

<br><br>

It does NOT modify or interact with the
live BnBeeHive mainnet contract.

</div>


<div class="box">

<strong>Required Network</strong>

<br><br>

BNB Smart Chain Testnet

<br>

Chain ID: 97

</div>


<button onclick="connectWallet()">
Connect Wallet
</button>


<button
  id="deployButton"
  onclick="deployReceiver()"
  disabled
>
Deploy Test Hive Receiver
</button>


<div
  id="status"
  class="box"
>
Ready.
</div>


</div>


<!--
Generated automatically by GitHub Actions.
Contains TEST_HIVE_RECEIVER_BYTECODE.
-->
<script src="test-hive-receiver-bytecode.js"></script>


<script>

let account = null;


/* =========================================================
   WALLET
   ========================================================= */

function getProvider(){

  if(
    typeof window.ethereum !== "undefined"
  ){
    return window.ethereum;
  }

  throw new Error(
    "Wallet provider not found. Open this page inside your wallet browser."
  );
}


/* =========================================================
   CHAIN CHECK
   ========================================================= */

async function requireTestnet(){

  const provider =
    getProvider();

  const chainId =
    await provider.request({
      method:"eth_chainId"
    });


  /*
    BSC Testnet:

    decimal 97
    hex 0x61
  */

  if(
    chainId.toLowerCase() !== "0x61"
  ){

    throw new Error(
      "Wrong network. Switch your wallet to BNB Smart Chain Testnet (Chain ID 97)."
    );
  }


  return chainId;
}


/* =========================================================
   CONNECT
   ========================================================= */

async function connectWallet(){

  const status =
    document.getElementById("status");

  const deployButton =
    document.getElementById(
      "deployButton"
    );


  try{

    status.innerHTML =
      "Connecting...";


    const provider =
      getProvider();


    await requireTestnet();


    const accounts =
      await provider.request({
        method:"eth_requestAccounts"
      });


    if(
      !accounts ||
      accounts.length === 0
    ){
      throw new Error(
        "No wallet account returned."
      );
    }


    account =
      accounts[0];


    status.innerHTML = `
      <span class="good">
      Connected ✅
      </span>

      <br><br>

      BSC Testnet

      <br><br>

      Wallet:

      <br>

      ${account}
    `;


    deployButton.disabled =
      false;


  }catch(error){

    account =
      null;


    deployButton.disabled =
      true;


    status.innerHTML = `
      <span class="bad">
      Connection failed ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* =========================================================
   DEPLOY TEST RECEIVER
   ========================================================= */

async function deployReceiver(){

  const status =
    document.getElementById("status");

  const deployButton =
    document.getElementById(
      "deployButton"
    );


  try{

    if(!account){

      throw new Error(
        "Connect wallet first."
      );
    }


    await requireTestnet();


    /*
      Make sure the generated bytecode
      file loaded correctly.
    */

    if(
      typeof window.TEST_HIVE_RECEIVER_BYTECODE
        !== "string" ||
      !window.TEST_HIVE_RECEIVER_BYTECODE
        .startsWith("0x") ||
      window.TEST_HIVE_RECEIVER_BYTECODE
        .length < 10
    ){

      throw new Error(
        "Test receiver bytecode was not loaded."
      );
    }


    deployButton.disabled =
      true;


    status.innerHTML = `
      <span class="warning">
      Waiting for wallet...
      </span>

      <br><br>

      Review and approve the TESTNET
      contract deployment in your wallet.

      <br><br>

      Do not approve if your wallet shows
      BSC Mainnet.
    `;


    /*
      Contract deployment:

      No "to" address is supplied.

      data = TestHiveReceiver creation
      bytecode generated by GitHub Actions.

      value = 0.
    */

    const txHash =
      await getProvider().request({

        method:
          "eth_sendTransaction",

        params:[
          {
            from:
              account,

            data:
              window.TEST_HIVE_RECEIVER_BYTECODE,

            value:
              "0x0"
          }
        ]

      });


    status.innerHTML = `
      <span class="good">
      Deployment sent ✅
      </span>

      <br><br>

      Transaction:

      <br>

      ${txHash}

      <br><br>

      Waiting for confirmation...
    `;


    /*
      Wait for receipt.
    */

    let receipt =
      null;


    while(!receipt){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            2500
          )
      );


      receipt =
        await getProvider().request({

          method:
            "eth_getTransactionReceipt",

          params:[
            txHash
          ]

        });

    }


    /*
      Check transaction status.
    */

    if(
      receipt.status &&
      receipt.status.toLowerCase()
        !== "0x1"
    ){

      throw new Error(
        "Deployment transaction reverted."
      );
    }


    if(
      !receipt.contractAddress
    ){

      throw new Error(
        "Deployment confirmed but no contract address was returned."
      );
    }


    status.innerHTML = `
      <span class="good">
      TEST RECEIVER DEPLOYED ✅
      </span>

      <br><br>

      <strong>
      Contract Address:
      </strong>

      <br><br>

      ${receipt.contractAddress}

      <br><br>

      <strong>
      Transaction:
      </strong>

      <br><br>

      ${txHash}

      <br><br>

      Save this contract address.

      <br><br>

      We will use it as the Hive funding
      address when deploying HiveToken V4
      on BSC Testnet.
    `;


  }catch(error){

    deployButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      Deployment failed ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }
}


/* =========================================================
   WALLET CHANGES
   ========================================================= */

if(
  typeof window.ethereum !== "undefined"
){

  window.ethereum.on(
    "accountsChanged",
    function(){
      account = null;

      document.getElementById(
        "deployButton"
      ).disabled = true;

      document.getElementById(
        "status"
      ).innerHTML =
        "Wallet changed. Connect again.";
    }
  );


  window.ethereum.on(
    "chainChanged",
    function(){
      account = null;

      document.getElementById(
        "deployButton"
      ).disabled = true;

      document.getElementById(
        "status"
      ).innerHTML =
        "Network changed. Connect again.";
    }
  );

}

</script>

</body>
</html>
