<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>HiveToken V4 Liquidity</title>

<style>

body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}

h1{
  color:#ffd45c;
}

.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}

button{
  width:100%;
  padding:18px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.good{
  color:#55ef7a;
  font-weight:bold;
}

.bad{
  color:#ff5c5c;
  font-weight:bold;
}

.warning{
  color:#ffd45c;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Liquidity Test</h1>


<div class="box">

<strong>TESTNET ONLY</strong>

<br><br>

HiveToken V4:

<br>

0x305cecf060209f758b74dbef91758021f113c608

<br><br>

V4 HIVE/WBNB Pair:

<br>

0x3f8016dea6df1323fe2bee493b15593a8a2b149e

</div>


<div class="box">

<strong>Test Liquidity</strong>

<br><br>

10,000 HIVE

<br>

+

<br>

0.01 tBNB

<br><br>

This is testnet only.

</div>


<button onclick="connectWallet()">
1. Connect Wallet
</button>


<button
  id="approveButton"
  onclick="approveHive()"
  disabled
>
2. Approve 10,000 HIVE
</button>


<button
  id="liquidityButton"
  onclick="addLiquidity()"
  disabled
>
3. Add Test Liquidity
</button>


<div
  id="status"
  class="box"
>
Ready.
</div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
</script>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";

const PAIR =
"0x3f8016dea6df1323fe2bee493b15593a8a2b149e";

const ROUTER =
"0xd99d1c33f9fc3444f8101754abc46c52416550d1";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";


const HIVE_AMOUNT =
ethers.utils.parseUnits(
  "10000",
  18
);


const BNB_AMOUNT =
ethers.utils.parseEther(
  "0.01"
);


let account =
  null;


/* =========================================================
   WALLET
   ========================================================= */

function getEthereum(){

  if(
    typeof window.ethereum === "undefined"
  ){

    throw new Error(
      "Wallet provider not found. Open this page inside your wallet browser."
    );
  }


  return window.ethereum;
}


function getProvider(){

  return new ethers.providers.Web3Provider(
    getEthereum()
  );
}


function getSigner(){

  return getProvider().getSigner();
}


/* =========================================================
   NETWORK
   ========================================================= */

async function requireTestnet(){

  const chainId =
    await getEthereum().request({
      method:"eth_chainId"
    });


  if(
    chainId.toLowerCase() !== "0x61"
  ){

    throw new Error(
      "Wrong network. Use BNB Smart Chain Testnet — Chain ID 97."
    );
  }

}


/* =========================================================
   CONNECT
   ========================================================= */

async function connectWallet(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    await requireTestnet();


    const accounts =
      await getEthereum().request({
        method:
          "eth_requestAccounts"
      });


    if(
      !accounts ||
      accounts.length === 0
    ){

      throw new Error(
        "No wallet account returned."
      );
    }


    account =
      accounts[0];


    /*
      Verify token configuration before
      allowing liquidity.
    */

    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function owner() view returns(address)",
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)",
          "function isTaxExempt(address) view returns(bool)",
          "function balanceOf(address) view returns(uint256)",
          "function allowance(address,address) view returns(uint256)"
        ],
        getSigner()
      );


    const owner =
      await token.owner();


    if(
      owner.toLowerCase() !==
      account.toLowerCase()
    ){

      throw new Error(
        "Connected wallet is not the HiveToken V4 owner."
      );
    }


    const configuredPair =
      await token.pair();


    const pairLocked =
      await token.pairLocked();


    if(
      configuredPair.toLowerCase() !==
      PAIR.toLowerCase() ||
      !pairLocked
    ){

      throw new Error(
        "HiveToken V4 pair configuration does not match expected pair."
      );
    }


    const exempt =
      await token.isTaxExempt(
        account
      );


    if(!exempt){

      throw new Error(
        "Owner wallet is not tax exempt. Stop before adding liquidity."
      );
    }


    const hiveBalance =
      await token.balanceOf(
        account
      );


    if(
      hiveBalance.lt(
        HIVE_AMOUNT
      )
    ){

      throw new Error(
        "Wallet does not have 10,000 HIVE."
      );
    }


    const bnbBalance =
      await getProvider().getBalance(
        account
      );


    if(
      bnbBalance.lte(
        BNB_AMOUNT
      )
    ){

      throw new Error(
        "Wallet needs more than 0.01 tBNB to cover liquidity plus gas."
      );
    }


    const allowance =
      await token.allowance(
        account,
        ROUTER
      );


    if(
      allowance.gte(
        HIVE_AMOUNT
      )
    ){

      document.getElementById(
        "approveButton"
      ).disabled =
        true;


      document.getElementById(
        "liquidityButton"
      ).disabled =
        false;


      status.innerHTML = `
        <span class="good">
        READY FOR LIQUIDITY ✅
        </span>

        <br><br>

        Owner verified.

        <br>

        Pair verified and locked.

        <br>

        Owner tax exemption verified.

        <br>

        HIVE balance verified.

        <br>

        tBNB balance verified.

        <br>

        Router allowance already sufficient.

        <br><br>

        Press:

        <br>

        <strong>
        3. Add Test Liquidity
        </strong>
      `;


      return;
    }


    document.getElementById(
      "approveButton"
    ).disabled =
      false;


    status.innerHTML = `
      <span class="good">
      WALLET VERIFIED ✅
      </span>

      <br><br>

      Owner verified.

      <br>

      Pair verified and locked.

      <br>

      Owner tax exemption verified.

      <br>

      HIVE balance verified.

      <br>

      tBNB balance verified.

      <br><br>

      <strong>
      Press button 2 to approve
      10,000 HIVE.
      </strong>
    `;


  }catch(error){

    status.innerHTML = `
      <span class="bad">
      CHECK FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   APPROVE HIVE
   ========================================================= */

async function approveHive(){

  const status =
    document.getElementById(
      "status"
    );


  const approveButton =
    document.getElementById(
      "approveButton"
    );


  try{

    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect wallet first."
      );
    }


    approveButton.disabled =
      true;


    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function approve(address,uint256) returns(bool)",
          "function allowance(address,address) view returns(uint256)"
        ],
        getSigner()
      );


    status.innerHTML = `
      <span class="warning">
      APPROVAL REQUIRED
      </span>

      <br><br>

      Your wallet will ask you to approve:

      <br><br>

      <strong>
      10,000 HIVE
      </strong>

      <br><br>

      Spender:

      <br>

      PancakeSwap Testnet Router

      <br><br>

      ${ROUTER}
    `;


    const tx =
      await token.approve(
        ROUTER,
        HIVE_AMOUNT
      );


    status.innerHTML = `
      Approval sent ✅

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    const allowance =
      await token.allowance(
        account,
        ROUTER
      );


    if(
      allowance.lt(
        HIVE_AMOUNT
      )
    ){

      throw new Error(
        "Approval confirmed but allowance is below 10,000 HIVE."
      );
    }


    document.getElementById(
      "liquidityButton"
    ).disabled =
      false;


    status.innerHTML = `
      <span class="good">
      10,000 HIVE APPROVED ✅
      </span>

      <br><br>

      Router allowance verified.

      <br><br>

      <strong>
      Next press:

      <br><br>

      3. Add Test Liquidity
      </strong>
    `;


  }catch(error){

    approveButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      APPROVAL FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   ADD LIQUIDITY
   ========================================================= */

async function addLiquidity(){

  const status =
    document.getElementById(
      "status"
    );


  const liquidityButton =
    document.getElementById(
      "liquidityButton"
    );


  try{

    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect wallet first."
      );
    }


    liquidityButton.disabled =
      true;


    /*
      Verify pair one final time.
    */

    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)",
          "function allowance(address,address) view returns(uint256)"
        ],
        getSigner()
      );


    const configuredPair =
      await token.pair();


    const locked =
      await token.pairLocked();


    if(
      !locked ||
      configuredPair.toLowerCase() !==
      PAIR.toLowerCase()
    ){

      throw new Error(
        "Pair verification failed."
      );
    }


    const allowance =
      await token.allowance(
        account,
        ROUTER
      );


    if(
      allowance.lt(
        HIVE_AMOUNT
      )
    ){

      throw new Error(
        "Router allowance is below 10,000 HIVE."
      );
    }


    /*
      Router addLiquidityETH.

      amountTokenMin and amountETHMin are
      set equal to desired amounts because
      this is the first liquidity for the
      new empty pair.

      LP tokens go directly to owner wallet.
    */

    const router =
      new ethers.Contract(
        ROUTER,
        [
          "function addLiquidityETH(address token,uint256 amountTokenDesired,uint256 amountTokenMin,uint256 amountETHMin,address to,uint256 deadline) payable returns(uint256 amountToken,uint256 amountETH,uint256 liquidity)"
        ],
        getSigner()
      );


    const block =
      await getProvider().getBlock(
        "latest"
      );


    const deadline =
      block.timestamp + 1200;


    status.innerHTML = `
      <span class="warning">
      ADDING TEST LIQUIDITY
      </span>

      <br><br>

      Your wallet will ask you to approve:

      <br><br>

      <strong>
      10,000 HIVE
      </strong>

      <br>

      +

      <br>

      <strong>
      0.01 tBNB
      </strong>

      <br><br>

      LP tokens will be sent to:

      <br><br>

      ${account}

      <br><br>

      TESTNET ONLY.
    `;


    const tx =
      await router.addLiquidityETH(
        TOKEN,
        HIVE_AMOUNT,
        HIVE_AMOUNT,
        BNB_AMOUNT,
        account,
        deadline,
        {
          value:
            BNB_AMOUNT
        }
      );


    status.innerHTML = `
      <span class="good">
      LIQUIDITY TRANSACTION SENT ✅
      </span>

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    /*
      Verify LP token balance.
    */

    const pair =
      new ethers.Contract(
        PAIR,
        [
          "function balanceOf(address) view returns(uint256)",
          "function totalSupply() view returns(uint256)",
          "function getReserves() view returns(uint112,uint112,uint32)",
          "function token0() view returns(address)",
          "function token1() view returns(address)"
        ],
        getProvider()
      );


    const lpBalance =
      await pair.balanceOf(
        account
      );


    const totalLP =
      await pair.totalSupply();


    const reserves =
      await pair.getReserves();


    const token0 =
      await pair.token0();


    const token1 =
      await pair.token1();


    if(
      lpBalance.eq(0)
    ){

      throw new Error(
        "Liquidity transaction confirmed but owner LP balance is zero."
      );
    }


    if(
      totalLP.eq(0)
    ){

      throw new Error(
        "Pair total LP supply is zero."
      );
    }


    status.innerHTML = `
      <span class="good">
      V4 TEST LIQUIDITY ADDED ✅
      </span>

      <br><br>

      <strong>
      Pair:
      </strong>

      <br><br>

      ${PAIR}

      <br><br>

      <strong>
      LP Tokens Received:
      </strong>

      <br><br>

      ${ethers.utils.formatUnits(
        lpBalance,
        18
      )}

      <br><br>

      <strong>
      Pair Token 0:
      </strong>

      <br>

      ${token0}

      <br><br>

      <strong>
      Pair Token 1:
      </strong>

      <br>

      ${token1}

      <br><br>

      <strong>
      Reserve 0:
      </strong>

      <br>

      ${reserves[0].toString()}

      <br><br>

      <strong>
      Reserve 1:
      </strong>

      <br>

      ${reserves[1].toString()}

      <br><br>

      <strong>
      TEST LIQUIDITY VERIFIED ✅
      </strong>

      <br><br>

      STOP HERE.

      <br><br>

      Do not perform a buy or sell yet.

      <br><br>

      Send me a screenshot of this result.
    `;


  }catch(error){

    liquidityButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      LIQUIDITY FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   WALLET CHANGES
   ========================================================= */

if(
  typeof window.ethereum !== "undefined"
){

  window.ethereum.on(
    "accountsChanged",
    function(){
      location.reload();
    }
  );


  window.ethereum.on(
    "chainChanged",
    function(){
      location.reload();
    }
  );

}

</script>

</body>
</html>
