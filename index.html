<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HiveToken V4 Buy Tax Test</title>

<style>
body{
  background:#0b0f0b;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}
h1{color:#ffd45c;}
.box{
  background:#050705;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.7;
}
button{
  width:100%;
  padding:18px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:#ffd45c;
  color:#111;
  font-size:18px;
  font-weight:bold;
}
button:disabled{opacity:.45;}
.good{color:#55ef7a;font-weight:bold;}
.bad{color:#ff5c5c;font-weight:bold;}
.warning{color:#ffd45c;font-weight:bold;}
</style>
</head>

<body>

<div class="card">

<h1>🐝 HiveToken V4 Buy Tax Test</h1>

<div class="box">

<strong>TESTNET ONLY</strong>

<br><br>

Buy amount:

<br>

<strong>0.001 tBNB</strong>

<br><br>

Expected HIVE buy tax:

<br>

<strong>2.5%</strong>

</div>


<div class="box">

<strong>HiveToken V4</strong>

<br><br>

0x305cecf060209f758b74dbef91758021f113c608

<br><br>

<strong>V4 HIVE/WBNB Pair</strong>

<br><br>

0x3f8016dea6df1323fe2bee493b15593a8a2b149e

</div>


<button onclick="connectWallet()">
1. Connect Buyer Wallet
</button>


<button
  id="buyButton"
  onclick="runBuyTest()"
  disabled
>
2. Buy HIVE With 0.001 tBNB
</button>


<div
  id="status"
  class="box"
>
Ready.
</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
</script>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const TOKEN =
"0x305cecf060209f758b74dbef91758021f113c608";

const PAIR =
"0x3f8016dea6df1323fe2bee493b15593a8a2b149e";

const ROUTER =
"0xd99d1c33f9fc3444f8101754abc46c52416550d1";

const WBNB =
"0xae13d989dac2f0debff460ac112a837c89baa7cd";

const BUY_AMOUNT =
ethers.utils.parseEther(
  "0.001"
);

let account =
  null;


/* =========================================================
   PROVIDER
   ========================================================= */

function ethereum(){

  if(!window.ethereum){

    throw new Error(
      "Wallet provider not found."
    );
  }

  return window.ethereum;
}


function provider(){

  return new ethers.providers.Web3Provider(
    ethereum()
  );
}


function signer(){

  return provider().getSigner();
}


/* =========================================================
   NETWORK
   ========================================================= */

async function requireTestnet(){

  const chainId =
    await ethereum().request({
      method:"eth_chainId"
    });


  if(
    chainId.toLowerCase() !== "0x61"
  ){

    throw new Error(
      "Wrong network. Use BNB Smart Chain Testnet — Chain ID 97."
    );
  }

}


/* =========================================================
   CONNECT BUYER
   ========================================================= */

async function connectWallet(){

  const status =
    document.getElementById(
      "status"
    );


  try{

    await requireTestnet();


    const accounts =
      await ethereum().request({
        method:
          "eth_requestAccounts"
      });


    if(
      !accounts ||
      accounts.length === 0
    ){

      throw new Error(
        "No wallet account returned."
      );
    }


    account =
      accounts[0];


    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function owner() view returns(address)",
          "function isTaxExempt(address) view returns(bool)",
          "function pair() view returns(address)",
          "function pairLocked() view returns(bool)"
        ],
        provider()
      );


    const owner =
      await token.owner();


    /*
      Buyer must NOT be owner.
    */

    if(
      account.toLowerCase() ===
      owner.toLowerCase()
    ){

      throw new Error(
        "This is the owner wallet. Switch to the second non-owner test wallet."
      );
    }


    /*
      Buyer must NOT be tax exempt.
    */

    const exempt =
      await token.isTaxExempt(
        account
      );


    if(exempt){

      throw new Error(
        "This wallet is tax exempt. Use a non-exempt test wallet."
      );
    }


    /*
      Verify pair configuration.
    */

    const configuredPair =
      await token.pair();


    const locked =
      await token.pairLocked();


    if(
      !locked ||
      configuredPair.toLowerCase() !==
      PAIR.toLowerCase()
    ){

      throw new Error(
        "V4 pair verification failed."
      );
    }


    /*
      Check tBNB.
    */

    const bnbBalance =
      await provider().getBalance(
        account
      );


    if(
      bnbBalance.lte(
        BUY_AMOUNT
      )
    ){

      throw new Error(
        "Buyer needs more than 0.001 tBNB for the buy plus gas."
      );
    }


    document.getElementById(
      "buyButton"
    ).disabled =
      false;


    status.innerHTML = `
      <span class="good">
      BUYER READY ✅
      </span>

      <br><br>

      Wallet:

      <br><br>

      ${account}

      <br><br>

      Non-owner verified.

      <br>

      Non-exempt verified.

      <br>

      V4 pair verified.

      <br>

      tBNB balance verified.

      <br><br>

      <strong>
      Press button 2 to run the
      0.001 tBNB buy-tax test.
      </strong>
    `;


  }catch(error){

    document.getElementById(
      "buyButton"
    ).disabled =
      true;


    status.innerHTML = `
      <span class="bad">
      BUYER CHECK FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   BUY TAX TEST
   ========================================================= */

async function runBuyTest(){

  const status =
    document.getElementById(
      "status"
    );


  const buyButton =
    document.getElementById(
      "buyButton"
    );


  try{

    await requireTestnet();


    if(!account){

      throw new Error(
        "Connect buyer wallet first."
      );
    }


    buyButton.disabled =
      true;


    const token =
      new ethers.Contract(
        TOKEN,
        [
          "function balanceOf(address) view returns(uint256)"
        ],
        provider()
      );


    /*
      Record balances BEFORE buy.
    */

    const buyerBefore =
      await token.balanceOf(
        account
      );


    const taxBefore =
      await token.balanceOf(
        TOKEN
      );


    const pairBefore =
      await token.balanceOf(
        PAIR
      );


    /*
      PancakeSwap router.

      SupportingFeeOnTransferTokens is
      required because HIVE charges its
      2.5% buy tax when pair -> buyer.
    */

    const router =
      new ethers.Contract(
        ROUTER,
        [
          "function swapExactETHForTokensSupportingFeeOnTransferTokens(uint256 amountOutMin,address[] calldata path,address to,uint256 deadline) payable"
        ],
        signer()
      );


    const block =
      await provider().getBlock(
        "latest"
      );


    const deadline =
      block.timestamp + 1200;


    const path =
      [
        WBNB,
        TOKEN
      ];


    status.innerHTML = `
      <span class="warning">
      BUY TAX TEST
      </span>

      <br><br>

      Your wallet will ask you to swap:

      <br><br>

      <strong>
      0.001 tBNB → HIVE
      </strong>

      <br><br>

      TESTNET ONLY.
    `;


    const tx =
      await router
        .swapExactETHForTokensSupportingFeeOnTransferTokens(
          0,
          path,
          account,
          deadline,
          {
            value:
              BUY_AMOUNT
          }
        );


    status.innerHTML = `
      <span class="good">
      BUY SENT ✅
      </span>

      <br><br>

      ${tx.hash}

      <br><br>

      Waiting for confirmation...
    `;


    await tx.wait();


    /*
      Read balances AFTER buy.
    */

    const buyerAfter =
      await token.balanceOf(
        account
      );


    const taxAfter =
      await token.balanceOf(
        TOKEN
      );


    const pairAfter =
      await token.balanceOf(
        PAIR
      );


    const buyerReceived =
      buyerAfter.sub(
        buyerBefore
      );


    const taxCollected =
      taxAfter.sub(
        taxBefore
      );


    const pairSent =
      pairBefore.sub(
        pairAfter
      );


    /*
      Exact expected tax:

      gross pair transfer * 250 / 10000
    */

    const expectedTax =
      pairSent
        .mul(250)
        .div(10000);


    const expectedBuyer =
      pairSent.sub(
        expectedTax
      );


    const taxPass =
      taxCollected.eq(
        expectedTax
      );


    const buyerPass =
      buyerReceived.eq(
        expectedBuyer
      );


    if(
      taxPass &&
      buyerPass
    ){

      status.innerHTML = `
        <span class="good">
        V4 BUY TAX PASSED ✅
        </span>

        <br><br>

        <strong>
        Gross HIVE sent by pair:
        </strong>

        <br>

        ${ethers.utils.formatUnits(
          pairSent,
          18
        )} HIVE

        <br><br>

        <strong>
        Buyer received:
        </strong>

        <br>

        ${ethers.utils.formatUnits(
          buyerReceived,
          18
        )} HIVE

        <br><br>

        <strong>
        HIVE tax collected:
        </strong>

        <br>

        ${ethers.utils.formatUnits(
          taxCollected,
          18
        )} HIVE

        <br><br>

        <strong>
        Expected 2.5% tax:
        </strong>

        <br>

        ${ethers.utils.formatUnits(
          expectedTax,
          18
        )} HIVE

        <br><br>

        <span class="good">
        EXACT 2.5% BUY TAX VERIFIED ✅
        </span>

        <br><br>

        STOP HERE.

        <br><br>

        Do not sell yet.

        <br><br>

        Send me a screenshot.
      `;

    }else{

      status.innerHTML = `
        <span class="bad">
        BUY TAX CHECK FAILED ❌
        </span>

        <br><br>

        Gross pair transfer:

        <br>

        ${ethers.utils.formatUnits(
          pairSent,
          18
        )} HIVE

        <br><br>

        Buyer received:

        <br>

        ${ethers.utils.formatUnits(
          buyerReceived,
          18
        )} HIVE

        <br><br>

        Actual tax:

        <br>

        ${ethers.utils.formatUnits(
          taxCollected,
          18
        )} HIVE

        <br><br>

        Expected tax:

        <br>

        ${ethers.utils.formatUnits(
          expectedTax,
          18
        )} HIVE

        <br><br>

        STOP HERE.
      `;
    }


  }catch(error){

    buyButton.disabled =
      false;


    status.innerHTML = `
      <span class="bad">
      BUY TEST FAILED ❌
      </span>

      <br><br>

      ${error.message}
    `;
  }

}


/* =========================================================
   WALLET CHANGES
   ========================================================= */

if(window.ethereum){

  window.ethereum.on(
    "accountsChanged",
    function(){
      location.reload();
    }
  );


  window.ethereum.on(
    "chainChanged",
    function(){
      location.reload();
    }
  );

}

</script>

</body>
</html>
