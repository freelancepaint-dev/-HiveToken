<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HiveToken V3 Diagnostic</title>

<style>
body {
  background:#0b0f0b;
  color:#fff;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}

.card {
  max-width:650px;
  margin:auto;
  background:#151a15;
  border:1px solid #3c473c;
  border-radius:18px;
  padding:22px;
}

h1 {
  color:#ffd45c;
}

button {
  width:100%;
  padding:17px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}

.primary {
  background:#ffd45c;
  color:#111;
}

.secondary {
  background:#eee;
  color:#111;
}

.box {
  background:#050705;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
  overflow-wrap:anywhere;
  line-height:1.6;
}

.label {
  color:#aaa;
}

.good {
  color:#55ef7a;
  font-weight:bold;
}

.bad {
  color:#ff5c5c;
  font-weight:bold;
}

.warning {
  color:#ffd45c;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>HiveToken V3 Diagnostic</h1>

<p>
Read-only test. This page does not submit token transactions.
</p>

<div class="box">
<span class="label">V3 Token</span><br>
0xf10f0091a7504761e5e0cab7a7de34df077871f8
</div>

<div class="box">
<span class="label">Expected Pair</span><br>
0x56b09a344c35c4e3c2d14beb76ebae951ceb51a6
</div>

<button class="primary" onclick="connectAndSwitch()">
1. Connect + Switch to BSC Testnet
</button>

<button class="secondary" onclick="runChecks()">
2. Run V3 Contract Checks
</button>

<div id="connection" class="box">
Not connected.
</div>

<div id="results" class="box">
Checks not run.
</div>

</div>


<script>

const TOKEN =
"0xf10f0091a7504761e5e0cab7a7de34df077871f8";

const EXPECTED_PAIR =
"0x56b09a344c35c4e3c2d14beb76ebae951ceb51a6";

const TESTNET_CHAIN =
"0x61";

let account = null;


/* --------------------------
   CONNECT + FORCE TESTNET
--------------------------- */

async function connectAndSwitch() {

  const status =
    document.getElementById("connection");

  try {

    if (!window.ethereum) {

      status.innerHTML =
        "<span class='bad'>No wallet provider found.</span>";

      return;
    }

    const accounts =
      await window.ethereum.request({
        method:"eth_requestAccounts"
      });

    account = accounts[0];

    let chain =
      await window.ethereum.request({
        method:"eth_chainId"
      });


    if (chain.toLowerCase() !== TESTNET_CHAIN) {

      status.innerHTML =
        "<span class='warning'>Switching to BSC Testnet...</span>";

      try {

        await window.ethereum.request({
          method:"wallet_switchEthereumChain",
          params:[
            {
              chainId:TESTNET_CHAIN
            }
          ]
        });

      } catch (switchError) {

        /*
          4902 means the network isn't configured
          in the wallet yet.
        */

        if (switchError.code === 4902) {

          await window.ethereum.request({
            method:"wallet_addEthereumChain",
            params:[
              {
                chainId:"0x61",
                chainName:"BSC Testnet",
                nativeCurrency:{
                  name:"tBNB",
                  symbol:"tBNB",
                  decimals:18
                },
                rpcUrls:[
                  "https://data-seed-prebsc-1-s1.bnbchain.org:8545/"
                ],
                blockExplorerUrls:[
                  "https://testnet.bscscan.com"
                ]
              }
            ]
          });

        } else {

          throw switchError;
        }
      }
    }


    chain =
      await window.ethereum.request({
        method:"eth_chainId"
      });


    status.innerHTML = `

      <span class="label">Wallet</span><br>
      ${account}

      <br><br>

      <span class="label">Chain ID</span><br>
      ${chain}

      <br><br>

      ${
        chain.toLowerCase() === TESTNET_CHAIN

        ? "<span class='good'>BSC Testnet confirmed ✅</span>"

        : "<span class='bad'>Wrong network ❌</span>"
      }

    `;

  } catch(error) {

    status.innerHTML =
      "<span class='bad'>Connection error:</span><br>" +
      error.message;
  }
}


/* --------------------------
   FUNCTION SELECTOR
--------------------------- */

async function selector(signature) {

  const bytes =
    new TextEncoder().encode(signature);

  let hex = "0x";

  for (const byte of bytes) {

    hex +=
      byte.toString(16).padStart(2,"0");
  }

  const hash =
    await window.ethereum.request({
      method:"web3_sha3",
      params:[hex]
    });

  return hash.slice(0,10);
}


/* --------------------------
   READ CONTRACT
--------------------------- */

async function callContract(data) {

  return await window.ethereum.request({

    method:"eth_call",

    params:[
      {
        to:TOKEN,
        data:data
      },
      "latest"
    ]
  });
}


/* --------------------------
   DECODERS
--------------------------- */

function decodeAddress(data) {

  if (!data || data === "0x")
    return null;

  return (
    "0x" +
    data.slice(-40)
  );
}


function decodeUint(data) {

  if (!data || data === "0x")
    return null;

  return BigInt(data).toString();
}


function decodeBool(data) {

  if (!data || data === "0x")
    return null;

  return BigInt(data) !== 0n;
}


function encodeAddress(address) {

  return address
    .toLowerCase()
    .replace("0x","")
    .padStart(64,"0");
}


/* --------------------------
   RUN ALL CHECKS
--------------------------- */

async function runChecks() {

  const output =
    document.getElementById("results");

  try {

    if (!window.ethereum) {

      output.innerHTML =
        "<span class='bad'>No wallet provider.</span>";

      return;
    }


    const chain =
      await window.ethereum.request({
        method:"eth_chainId"
      });


    if (
      chain.toLowerCase() !==
      TESTNET_CHAIN
    ) {

      output.innerHTML =
        "<span class='bad'>" +
        "STOP — wallet is not on BSC Testnet." +
        "</span><br><br>" +
        "Tap Connect + Switch to BSC Testnet first.";

      return;
    }


    output.innerHTML =
      "Reading deployed V3 contract...";


    /* CALCULATE ALL SELECTORS */

    const ownerSelector =
      await selector("owner()");

    const pairSelector =
      await selector("pair()");

    const lockedSelector =
      await selector("pairLocked()");

    const buySelector =
      await selector("BUY_TAX()");

    const sellSelector =
      await selector("SELL_TAX()");

    const thresholdSelector =
      await selector("swapThreshold()");

    const exemptSelector =
      await selector("isTaxExempt(address)");

    const hiveSelector =
      await selector("hiveAddress()");

    const routerSelector =
      await selector("router()");


    /* READ CONTRACT */

    const owner =
      decodeAddress(
        await callContract(ownerSelector)
      );

    const pair =
      decodeAddress(
        await callContract(pairSelector)
      );

    const pairLocked =
      decodeBool(
        await callContract(lockedSelector)
      );

    const buyTax =
      decodeUint(
        await callContract(buySelector)
      );

    const sellTax =
      decodeUint(
        await callContract(sellSelector)
      );

    const threshold =
      decodeUint(
        await callContract(thresholdSelector)
      );

    const hiveAddress =
      decodeAddress(
        await callContract(hiveSelector)
      );

    const router =
      decodeAddress(
        await callContract(routerSelector)
      );


    /* OWNER EXEMPT */

    let ownerExempt = null;

    if (owner) {

      ownerExempt =
        decodeBool(
          await callContract(
            exemptSelector +
            encodeAddress(owner)
          )
        );
    }


    /* CONNECTED WALLET EXEMPT */

    let walletExempt =
      "Wallet not connected";

    if (account) {

      walletExempt =
        decodeBool(
          await callContract(
            exemptSelector +
            encodeAddress(account)
          )
        );
    }


    /* PAIR EXEMPT */

    let pairExempt = null;

    if (pair) {

      pairExempt =
        decodeBool(
          await callContract(
            exemptSelector +
            encodeAddress(pair)
          )
        );
    }


    const pairMatch =
      pair &&
      pair.toLowerCase() ===
      EXPECTED_PAIR.toLowerCase();


    output.innerHTML = `

      <b>V3 ON-CHAIN RESULTS</b>

      <br><br>

      <span class="label">Owner</span><br>
      ${owner || "NO RETURN DATA"}

      <br><br>

      <span class="label">Stored Pair</span><br>
      ${pair || "NO RETURN DATA"}

      <br>

      ${
        pairMatch

        ? "<span class='good'>Pair Match: YES ✅</span>"

        : "<span class='bad'>Pair Match: NO ❌</span>"
      }

      <br><br>

      <span class="label">Pair Locked</span><br>
      ${pairLocked}

      <br><br>

      <span class="label">BUY_TAX</span><br>
      ${buyTax}

      ${
        buyTax === "250"
        ? "<span class='good'> — 2.5% ✅</span>"
        : "<span class='bad'> ❌</span>"
      }

      <br><br>

      <span class="label">SELL_TAX</span><br>
      ${sellTax}

      ${
        sellTax === "250"
        ? "<span class='good'> — 2.5% ✅</span>"
        : "<span class='bad'> ❌</span>"
      }

      <br><br>

      <span class="label">Swap Threshold</span><br>
      ${threshold || "NO RETURN DATA"}

      <br>

      Expected:<br>
      100000000000000000000
      (100 HIVE)

      <br><br>

      <span class="label">Hive Funding Address</span><br>
      ${hiveAddress || "NO RETURN DATA"}

      <br><br>

      <span class="label">Router</span><br>
      ${router || "NO RETURN DATA"}

      <br><br>

      <span class="label">Owner Tax Exempt</span><br>
      ${ownerExempt}

      <br><br>

      <span class="label">Pair Tax Exempt</span><br>
      ${pairExempt}

      <br><br>

      <span class="label">
      Connected Wallet Tax Exempt
      </span><br>

      ${walletExempt}

    `;


  } catch(error) {

    output.innerHTML =

      "<span class='bad'>CHECK FAILED</span>" +

      "<br><br>" +

      error.message;
  }
}

</script>

</body>
</html>
