<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiveToken V2 Testnet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #11150f;
      color: #f5f1df;
      max-width: 650px;
      margin: auto;
      padding: 25px;
    }

    .box {
      border: 1px solid #555;
      border-radius: 18px;
      padding: 22px;
      margin-top: 20px;
    }

    button {
      font-size: 18px;
      font-weight: bold;
      padding: 15px 20px;
      margin: 8px 0;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    .warning {
      color: #ffd166;
      font-weight: bold;
    }

    #wallet, #contract, #status {
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>🐝 HiveToken V2</h1>

  <p class="warning">
    BNB SMART CHAIN TESTNET ONLY
  </p>

  <div class="box">
    <h2>Wallet</h2>

    <button id="connect">Connect Wallet</button>

    <p id="wallet">Not connected</p>
  </div>

  <div class="box">
    <h2>HiveToken Tax Test</h2>

    <p>Fixed Supply: 1,000,000 HIVE</p>
    <p>Owner Allocation: 150,000 HIVE</p>
    <p>Liquidity Allocation: 850,000 HIVE</p>
    <p>Buy Tax: 2.5%</p>
    <p>Sell Tax: 2.5%</p>
    <p>Wallet Transfers: 0%</p>

    <button id="deploy">
      Deploy HiveToken V2
    </button>
  </div>

  <div class="box">
    <h2>Status</h2>

    <p id="status">
      Connect your wallet first.
    </p>

    <p id="contract"></p>
  </div>

  <script src="./hive-bytecode.js"></script>

  <script>
    const TESTNET_CHAIN_ID = '0x61';

    // PancakeSwap V2 Router - BSC Testnet
    const PANCAKE_ROUTER =
      '0x9Ac64Cc6e4415144C455BD8E4837Fea55603e5c3';

    // Temporary TESTNET Hive receiver
    const HIVE_RECEIVER =
      '0x77Dc64A638100407F756393dF33640d5cDf45619';

    const walletText =
      document.getElementById('wallet');

    const statusText =
      document.getElementById('status');

    const contractText =
      document.getElementById('contract');

    let account = null;

    function encodeAddress(address) {
      return address
        .toLowerCase()
        .replace(/^0x/, '')
        .padStart(64, '0');
    }

    async function connectWallet() {
      if (!window.ethereum) {
        statusText.textContent =
          'Open this page inside a Web3 wallet browser.';
        return;
      }

      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{
            chainId: TESTNET_CHAIN_ID
          }]
        }).catch(async () => {

          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: TESTNET_CHAIN_ID,
              chainName: 'BNB Smart Chain Testnet',

              nativeCurrency: {
                name: 'tBNB',
                symbol: 'tBNB',
                decimals: 18
              },

              rpcUrls: [
                'https://data-seed-prebsc-1-s1.bnbchain.org:8545'
              ],

              blockExplorerUrls: [
                'https://testnet.bscscan.com'
              ]
            }]
          });

        });

        const accounts =
          await window.ethereum.request({
            method: 'eth_requestAccounts'
          });

        account = accounts[0];

        walletText.textContent = account;

        statusText.textContent =
          'Wallet connected. Ready to deploy HiveToken V2 on BNB Testnet.';

      } catch (error) {

        statusText.textContent =
          error.message ||
          'Wallet connection failed.';
      }
    }

    async function deployToken() {

      if (!account) {
        statusText.textContent =
          'Connect your wallet first.';
        return;
      }

      if (!window.HIVE_BYTECODE) {
        statusText.textContent =
          'Deployment bytecode not found.';
        return;
      }

      try {

        const routerArg =
          encodeAddress(PANCAKE_ROUTER);

        const hiveArg =
          encodeAddress(HIVE_RECEIVER);

        const deploymentData =
          window.HIVE_BYTECODE +
          routerArg +
          hiveArg;

        statusText.textContent =
          'Confirm the V2 TESTNET deployment in your wallet...';

        const txHash =
          await window.ethereum.request({
            method: 'eth_sendTransaction',

            params: [{
              from: account,
              data: deploymentData
            }]
          });

        statusText.textContent =
          'Deployment submitted. Waiting for confirmation...';

        let receipt = null;

        while (!receipt) {

          await new Promise(
            resolve =>
              setTimeout(resolve, 3000)
          );

          receipt =
            await window.ethereum.request({
              method:
                'eth_getTransactionReceipt',

              params: [txHash]
            });
        }

        if (receipt.status === '0x1') {

          statusText.textContent =
            'HiveToken V2 deployed successfully!';

          contractText.textContent =
            'Contract: ' +
            receipt.contractAddress;

        } else {

          statusText.textContent =
            'Deployment transaction failed.';
        }

      } catch (error) {

        statusText.textContent =
          error.message ||
          'Deployment failed.';
      }
    }

    document
      .getElementById('connect')
      .addEventListener(
        'click',
        connectWallet
      );

    document
      .getElementById('deploy')
      .addEventListener(
        'click',
        deployToken
      );
  </script>

</body>
</html>
