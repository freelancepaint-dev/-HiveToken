name: Build HiveToken

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Solidity compiler
        run: npm install solc@0.8.20

      - name: Compile HiveToken
        run: npx solcjs --bin --abi contracts/HiveToken.sol -o build
