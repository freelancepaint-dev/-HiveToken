
name: Build HiveToken

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hivetoken-build-main
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Solidity compiler
        run: npm install --no-save solc@0.8.20

      - name: Compile V4 V5 V6 and Test Receiver
        run: |
          set -eu
          rm -rf build
          mkdir -p build

          npx solcjs --bin --abi \
            contracts/HiveToken.sol \
            contracts/TestHiveReceiver.sol \
            contracts/HiveTokenV5.sol \
            contracts/HiveTokenV6.sol \
            -o build

          test -s build/contracts_HiveToken_sol_HiveToken.bin
          test -s build/contracts_HiveToken_sol_HiveToken.abi

          test -s build/contracts_TestHiveReceiver_sol_TestHiveReceiver.bin
          test -s build/contracts_TestHiveReceiver_sol_TestHiveReceiver.abi

          test -s build/contracts_HiveTokenV5_sol_HiveTokenV5.bin
          test -s build/contracts_HiveTokenV5_sol_HiveTokenV5.abi

          test -s build/contracts_HiveTokenV6_sol_HiveTokenV6.bin
          test -s build/contracts_HiveTokenV6_sol_HiveTokenV6.abi

          echo "All four contracts compiled successfully."

      - name: Generate V4 deployment files
        run: |
          set -eu

          HIVE_BIN=$(cat build/contracts_HiveToken_sol_HiveToken.bin)
          RECEIVER_BIN=$(cat build/contracts_TestHiveReceiver_sol_TestHiveReceiver.bin)

          printf "window.HIVE_BYTECODE='0x%s';\n" "$HIVE_BIN" > hive-bytecode.js
          printf "window.TEST_HIVE_RECEIVER_BYTECODE='0x%s';\n" "$RECEIVER_BIN" > test-hive-receiver-bytecode.js

          test -s hive-bytecode.js
          test -s test-hive-receiver-bytecode.js

      - name: Generate V5 deployment files
        run: |
          set -eu

          V5_BIN=$(cat build/contracts_HiveTokenV5_sol_HiveTokenV5.bin)

          printf "window.HIVE_V5_BYTECODE='0x%s';\n" "$V5_BIN" > hive-v5-bytecode.js

          cp build/contracts_HiveTokenV5_sol_HiveTokenV5.abi hive-v5-abi.json

          test -s hive-v5-bytecode.js
          test -s hive-v5-abi.json

          echo "V5 deployment bytecode and ABI generated."

      - name: Generate V6 deployment files
        run: |
          set -eu

          V6_BIN=$(cat build/contracts_HiveTokenV6_sol_HiveTokenV6.bin)

          printf "window.HIVE_V6_BYTECODE='0x%s';\n" "$V6_BIN" > hive-v6-bytecode.js

          cp build/contracts_HiveTokenV6_sol_HiveTokenV6.abi hive-v6-abi.json

          test -s hive-v6-bytecode.js
          test -s hive-v6-abi.json

          echo "V6 deployment bytecode and ABI generated."

      - name: Verify generated deployment files
        run: |
          set -eu

          for file in \
            hive-bytecode.js \
            test-hive-receiver-bytecode.js \
            hive-v5-bytecode.js \
            hive-v5-abi.json \
            hive-v6-bytecode.js \
            hive-v6-abi.json
          do
            test -s "$file"
            echo "Verified: $file"
          done

      - name: Commit deployment files
        run: |
          set -eu

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            hive-bytecode.js \
            test-hive-receiver-bytecode.js \
            hive-v5-bytecode.js \
            hive-v5-abi.json \
            hive-v6-bytecode.js \
            hive-v6-abi.json

          if git diff --cached --quiet; then
            echo "No deployment file changes."
            exit 0
          fi

          git commit -m "Generate V4 V5 and V6 deployment artifacts"
          git push
