name: Build HiveToken

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Solidity compiler
        run: npm install solc@0.8.20

      - name: Compile HiveToken
        run: |
          rm -rf build
          mkdir -p build
          npx solcjs --bin --abi contracts/HiveToken.sol -o build

      - name: Create deployment file
        run: |
          BIN=$(cat build/contracts_HiveToken_sol_HiveToken.bin)
          echo "window.HIVE_BYTECODE='0x${BIN}';" > hive-bytecode.js

      - name: Commit deployment file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hive-bytecode.js
          git diff --cached --quiet && exit 0
          git commit -m "Update HiveToken deployment bytecode"
          git push
