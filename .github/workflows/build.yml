
name: Build HiveToken

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Solidity compiler
        run: npm install solc@0.8.20

      - name: Compile V4 and Test Receiver
        run: |
          rm -rf build
          mkdir -p build
          npx solcjs --bin --abi contracts/HiveToken.sol contracts/TestHiveReceiver.sol -o build

      - name: Compile HiveToken V5
        run: |
          npx solcjs --bin --abi contracts/HiveTokenV5.sol -o build
          test -s build/contracts_HiveTokenV5_sol_HiveTokenV5.bin
          test -s build/contracts_HiveTokenV5_sol_HiveTokenV5.abi
          echo "HiveToken V5 compiled successfully."

      - name: Create V4 deployment files
        run: |
          HIVE_BIN=$(cat build/contracts_HiveToken_sol_HiveToken.bin)
          RECEIVER_BIN=$(cat build/contracts_TestHiveReceiver_sol_TestHiveReceiver.bin)

          echo "window.HIVE_BYTECODE='0x${HIVE_BIN}';" > hive-bytecode.js
          echo "window.TEST_HIVE_RECEIVER_BYTECODE='0x${RECEIVER_BIN}';" > test-hive-receiver-bytecode.js

      - name: Commit V4 deployment files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hive-bytecode.js test-hive-receiver-bytecode.js

          git diff --cached --quiet && exit 0

          git commit -m "Update V4 deployment bytecode"
          git push
